<style>

</style></head><body>
<div id="app"></div><div id="ov" class="ov"></div><div id="toast"></div><div id="eb" onclick="this.style.display='none'"></div>
<button class="p fab" onclick="book()">+</button>
<nav><b data-t="tl" onclick="tab='tl';render()">📅 تایم‌لاین</b><b data-t="fl" onclick="tab='fl';render()">🐾 پرونده‌ها</b><b data-t="st" onclick="tab='st';render()">⚙️ تنظیمات</b></nav>
<script src="html2canvas.min.js"></script><script src="jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s),P=n=>String(n).padStart(2,'0');
const FA=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const EN=s=>String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MN='فروردین اردیبهشت خرداد تیر مرداد شهریور مهر آبان آذر دی بهمن اسفند'.split(' ');
const WD='یکشنبه دوشنبه سه‌شنبه چهارشنبه پنجشنبه جمعه شنبه'.split(' ');
const TY=['سگ','گربه','پرنده','دیگر'];
const iso=d=>d.getFullYear()+'-'+P(d.getMonth()+1)+'-'+P(d.getDate());
const iso2=a=>a[0]+'-'+P(a[1])+'-'+P(a[2]);
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const TODAY=()=>iso(new Date());
function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334],y2=gm>2?gy+1:gy;let days=355666+365*gy+Math.floor((y2+3)/4)-Math.floor((y2+99)/100)+Math.floor((y2+399)/400)+gd+g[gm-1];let jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30),jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:((jm-7)*30)+186);let gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const sal=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13&&gd>sal[gm];gm++)gd-=sal[gm];return[gy,gm,gd]}
const J=s=>g2j(...s.split('-').map(Number));
const jd=s=>{const[y,m,d]=J(s);return FA(d)+' '+MN[m-1]+' '+FA(y)};
const DEF={clinic:'کلینیک دامپزشکی دکتر کوچک زاده',docExam:'دکتر معاینه',docSurg:'دکتر جراحی',dExam:20,dSurg:120,wS:10,wE:22,tBook:'{title} {name}، نوبت {kind} {animal} در تاریخ {date} ساعت {time} در {clinic} ثبت شد.',tVac:'{title} {name}، موعد واکسن {vaccine} {animal} در تاریخ {date} است. {clinic}',tDone:'{title} {name}، پرونده دیجیتال {animal} در {clinic} تکمیل شد. از اعتماد شما سپاسگزاریم.'};
let F=null,day=TODAY(),tab='tl',lastPh='';
const ST=()=>Object.assign({},DEF,SETS);
const M=n=>FA(Number(n||0).toLocaleString('en-US')).replace(/,/g,'٬');
const dd=(r,k)=>Number(r.dur)||Number(k=='surgery'?ST().dSurg:ST().dExam);
const P2=n=>P(n);const nowT=()=>{const d=new Date();return P(d.getHours())+'-'+P(d.getMinutes())+'-'+P(d.getSeconds())};
const jl=s=>J(s).map((x,i)=>i?P(x):x).join('-');
let SLR=[];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const hm=n=>P(Math.floor(n/60)%24)+':'+P(n%60);
const ttl=o=>o.gender||'';
const fill=(t,v)=>t.replace(/\{(\w+)\}/g,(m,k)=>v[k]==null?'':v[k]).replace(/\s+/g,' ').trim();
const opt=(a,s)=>a.map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join('');
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,3500)}
/* ---------- storage (SQLite) ---------- */
const PL={},plug=n=>{const C=window.Capacitor;if(!C)return null;return PL[n]||(PL[n]=(C.Plugins&&C.Plugins[n])||(C.registerPlugin?C.registerPlugin(n):null))},FS=()=>plug('Filesystem'),SQ=()=>plug('CapacitorSQLite'),DBN='clinic';
let BD='DOCUMENTS';
const errs=e=>{try{return String((e&&(e.message||e.errorMessage))||(typeof e=='object'?JSON.stringify(e):e))}catch(_){return String(e)}};
function fail(c,e){const b=$('#eb');b.textContent=c+': '+errs(e);b.style.display='block'}
let SETS={},TAGS=[],TAGC={};
const SCHEMA=`CREATE TABLE IF NOT EXISTS owners(phone TEXT PRIMARY KEY,name TEXT NOT NULL DEFAULT '',gender TEXT NOT NULL DEFAULT '',note TEXT NOT NULL DEFAULT '',notified INTEGER NOT NULL DEFAULT 0);
CREATE TABLE IF NOT EXISTS animals(id TEXT PRIMARY KEY,phone TEXT NOT NULL,type TEXT NOT NULL DEFAULT '',name TEXT NOT NULL DEFAULT '',breed TEXT NOT NULL DEFAULT '',sex TEXT NOT NULL DEFAULT '',birth TEXT NOT NULL DEFAULT '',weight TEXT NOT NULL DEFAULT '',neu TEXT NOT NULL DEFAULT '',allergy TEXT NOT NULL DEFAULT '',note TEXT NOT NULL DEFAULT '');
CREATE INDEX IF NOT EXISTS ix_an_ph ON animals(phone);
CREATE INDEX IF NOT EXISTS ix_an_nm ON animals(name);
CREATE TABLE IF NOT EXISTS vacc(id TEXT PRIMARY KEY,aid TEXT NOT NULL,name TEXT NOT NULL DEFAULT '',date TEXT NOT NULL DEFAULT '',due TEXT NOT NULL DEFAULT '',state TEXT NOT NULL DEFAULT 'none',amount INTEGER NOT NULL DEFAULT 0);
CREATE INDEX IF NOT EXISTS ix_v_aid ON vacc(aid);
CREATE INDEX IF NOT EXISTS ix_v_st ON vacc(state,due);
CREATE TABLE IF NOT EXISTS hist(id INTEGER PRIMARY KEY AUTOINCREMENT,aid TEXT NOT NULL,date TEXT NOT NULL DEFAULT '',type TEXT NOT NULL DEFAULT '',diag TEXT NOT NULL DEFAULT '',drug TEXT NOT NULL DEFAULT '',note TEXT NOT NULL DEFAULT '');
CREATE INDEX IF NOT EXISTS ix_h_aid ON hist(aid);
CREATE TABLE IF NOT EXISTS appts(id TEXT PRIMARY KEY,phone TEXT NOT NULL,aid TEXT NOT NULL DEFAULT '',kind TEXT NOT NULL DEFAULT 'exam',date TEXT NOT NULL,time TEXT NOT NULL,st TEXT NOT NULL DEFAULT 'wait',dur INTEGER NOT NULL DEFAULT 0,amount INTEGER NOT NULL DEFAULT 0);
CREATE INDEX IF NOT EXISTS ix_ap_d ON appts(date,kind);
CREATE TABLE IF NOT EXISTS settings(k TEXT PRIMARY KEY,v TEXT);
CREATE TABLE IF NOT EXISTS tags(name TEXT PRIMARY KEY,color INTEGER NOT NULL DEFAULT 5);
CREATE TABLE IF NOT EXISTS atags(aid TEXT NOT NULL,tag TEXT NOT NULL,PRIMARY KEY(aid,tag));`;
const Q=async(s,v=[])=>(await SQ().query({database:DBN,statement:s,values:v})).values||[];
let bt;const bk=()=>{clearTimeout(bt);bt=setTimeout(backup,2500)};
const X=async(s,v=[])=>{await SQ().run({database:DBN,statement:s,values:v});bk()};
const T=async set=>{const p=SQ();let m=false;try{await p.beginTransaction({database:DBN});m=true}catch(e){}
try{for(const x of set)await p.run({database:DBN,statement:x.statement,values:x.values||[],transaction:false});if(m)await p.commitTransaction({database:DBN})}catch(e){if(m)try{await p.rollbackTransaction({database:DBN})}catch(_){}throw e}bk()};
async function initDb(){const p=SQ();if(!p)throw new Error('پلاگین SQLite در اپ ثبت نشده');let pre='';
try{await p.createConnection({database:DBN,version:1,encrypted:false,mode:'no-encryption',readonly:false})}catch(e){pre+='createConnection: '+errs(e)+'\n'}
try{await p.open({database:DBN,readonly:false})}catch(e){pre+='open: '+errs(e)+'\n'}
try{await p.execute({database:DBN,statements:SCHEMA})}catch(e){throw new Error(errs(e)+'\n'+pre)}
for(const q of ['ALTER TABLE owners ADD COLUMN notified INTEGER NOT NULL DEFAULT 0;','ALTER TABLE appts ADD COLUMN dur INTEGER NOT NULL DEFAULT 0;','ALTER TABLE appts ADD COLUMN amount INTEGER NOT NULL DEFAULT 0;','ALTER TABLE vacc ADD COLUMN amount INTEGER NOT NULL DEFAULT 0;'])try{await p.execute({database:DBN,statements:q})}catch(e){}
for(const [n,c] of [['پرخاشگر',0],['ترسو',4]])await p.run({database:DBN,statement:'INSERT OR IGNORE INTO tags(name,color) VALUES(?,?)',values:[n,c]})}
async function probeDir(){for(const d of ['DOCUMENTS','EXTERNAL','DATA']){try{await FS().writeFile({path:BKD+'/.probe',data:'1',directory:d,encoding:'utf8',recursive:true});BD=d;return d}catch(e){}}return null}
async function loadTags(){TAGS=await Q('SELECT name,color FROM tags ORDER BY rowid');TAGC={};TAGS.forEach(t=>TAGC[t.name]=t.color)}
const tgh=x=>(x?String(x).split('|'):[]).map(n=>`<span class="tg c${TAGC[n]??5}">${E(n)}</span>`).join('');
async function loadSets(){SETS={};(await Q('SELECT k,v FROM settings')).forEach(x=>SETS[x.k]=x.v)}
const DBF='file:///data/data/ir.koochakzadeh.clinic/databases/clinicSQLite.db',BKD='KoochakzadehClinic',BKN=['clinic.db','clinic_2.db','clinic_3.db','clinic_4.db','clinic_5.db'];let BKC=BKN[0];
async function backup(th){try{if(!(await Q('SELECT 1 FROM owners LIMIT 1')).length)return;const f=FS();try{await SQ().execute({database:DBN,statements:'PRAGMA wal_checkpoint(TRUNCATE);'})}catch(e){}try{await f.mkdir({path:BKD,directory:BD,recursive:true})}catch(e){}
let last;for(const n of [BKC,...BKN.filter(x=>x!==BKC)]){try{try{await f.deleteFile({path:BKD+'/'+n,directory:BD})}catch(e){}await f.copy({from:DBF,to:BKD+'/'+n,toDirectory:BD});BKC=n;return}catch(e){last=e}}throw last}catch(e){if(th)throw e;toast('بکاپ ناموفق: '+errs(e))}}
async function bkPick(){let b=null;for(const n of BKN){try{const t=await FS().stat({path:BKD+'/'+n,directory:BD});if(!b||t.mtime>b.m)b={n,m:t.mtime}}catch(e){}}return b&&b.n}
async function restore(auto){if(!auto&&!confirm('دیتابیس فعلی با فایل بکاپ جایگزین میشه. ادامه؟'))return;try{const f=FS();try{await SQ().closeConnection({database:DBN,readonly:false})}catch(e){}const bn=await bkPick();if(!bn)throw new Error('فایل بکاپ پیدا نشد');const u=await f.getUri({path:BKD+'/'+bn,directory:BD});await f.copy({from:u.uri,to:DBF});await initDb();await loadSets();render();toast('بازیابی شد')}catch(e){toast('خطای بازیابی: '+(e.message||e));try{await initDb()}catch(_){}}}
/* ---------- sms ---------- */
function sendSms(n,t){return new Promise((ok,no)=>{const go=()=>{if(!window.sms)return no('پلاگین پیامک نصب نیست');sms.send(n,t,{replaceLineBreaks:false,android:{intent:''}},ok,e=>no(e))};try{const p=cordova.plugins.permissions;p.requestPermission(p.SEND_SMS,r=>r.hasPermission?go():no('اجازه ارسال پیامک داده نشد'),()=>no('خطا در اجازه'))}catch(e){go()}})}
/* ---------- pdf ---------- */
const KV=(k,v)=>v?`<div class="kv"><b>${k}</b>${E(v)}</div>`:'';
const hdr=(st,t)=>`<div class="hd"><div><h1>${E(st.clinic)}</h1><small>${t}</small></div><div class="logo"><img src="logo.png" width="48" height="48"></div></div>`;
const ftr=st=>`<div class="ft">${E(st.clinic)} · تاریخ صدور: ${jd(TODAY())} · ساعت ${FA(P(new Date().getHours())+':'+P(new Date().getMinutes()))}</div>`;
async function pdfOut(html,name){const w=document.createElement('div');w.id='pp';w.innerHTML=html;document.body.appendChild(w);try{await document.fonts.ready;const c=await html2canvas(w,{backgroundColor:'#fff',scale:2}),pxh=Math.floor(c.width*297/210),d=new jspdf.jsPDF({unit:'mm',format:'a4'});for(let y=0,i=0;y<c.height;y+=pxh,i++){const sc=document.createElement('canvas');sc.width=c.width;sc.height=Math.min(pxh,c.height-y);const g=sc.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,sc.width,sc.height);g.drawImage(c,0,y,c.width,sc.height,0,0,c.width,sc.height);if(i)d.addPage();d.addImage(sc.toDataURL('image/jpeg',.92),'JPEG',0,0,210,sc.height*210/c.width)}
await FS().writeFile({path:'KoochakzadehClinic/PDF/'+name+'.pdf',data:d.output('datauristring').split(',')[1],directory:BD,recursive:true});toast('PDF ذخیره شد: Documents/KoochakzadehClinic/PDF')}catch(e){toast('خطای PDF: '+(e.message||e))}w.remove()}
const dayRows=()=>Q(`SELECT x.*,o.name oname,a.type atype,a.name aname,(SELECT group_concat(tag,'|') FROM atags WHERE aid=a.id) tg,${INC} incx FROM appts x LEFT JOIN owners o ON o.phone=x.phone LEFT JOIN animals a ON a.id=x.aid WHERE x.date=? AND x.st!='cancel' ORDER BY x.time`,[day]);
async function pdfDay(){await loadTags();const st=ST(),L=await dayRows(),V=await vacPaid(),tot=L.reduce((a,x)=>a+(Number(x.amount)||0),0)+V.reduce((a,x)=>a+x.amount,0);pdfOut(`${hdr(st,'برنامه روزانه · '+WD[pd(day).getDay()]+' '+jd(day))}<div class="bd"><table><tr><th>ساعت</th><th>نوع نوبت</th><th>صاحب</th><th>حیوان</th><th>تلفن</th><th>وضعیت</th><th>مبلغ (تومان)</th></tr>${L.map(x=>{const sg=x.kind=='surgery',e=mins(x.time)+dd(x,x.kind);return `<tr><td>${FA(x.time)} تا ${FA(hm(e))}</td><td>${sg?'جراحی · '+E(st.docSurg):'معاینه · '+E(st.docExam)}</td><td>${E(x.oname)}</td><td>${E(x.atype)} ${E(x.aname)} ${tgh(x.tg)}</td><td>${FA(x.phone)}</td><td>${x.st=='arr'?'آمده':'در انتظار'}</td><td>${x.amount>0?M(x.amount):'—'}</td></tr>`}).join('')+V.map(x=>`<tr><td>—</td><td>واکسن · ${E(x.vname)}</td><td>${E(x.oname)}</td><td>${E(x.type)} ${E(x.aname)}</td><td>${FA(x.phone)}</td><td>انجام شد</td><td>${M(x.amount)}</td></tr>`).join('')||'<tr><td colspan="7">نوبتی ثبت نشده</td></tr>'}<tr class="tot"><td colspan="6">جمع کل روز</td><td>${M(tot)} تومان</td></tr></table></div>${ftr(st)}`,'timeline_'+jl(day)+'_'+nowT())}

async function vacSend(vid){const[v]=await Q(`SELECT v.name vname,v.due,a.name aname,a.type,o.phone,o.name oname,o.gender FROM vacc v JOIN animals a ON a.id=v.aid JOIN owners o ON o.phone=a.phone WHERE v.id=?`,[vid]),s=ST();try{await sendSms(v.phone,fill(s.tVac,{title:v.gender,name:v.oname,animal:v.aname||v.type,vaccine:v.vname,date:jd(v.due),clinic:s.clinic}));await X("UPDATE vacc SET state='sent' WHERE id=?",[vid]);render();toast('پیامک ارسال شد')}catch(e){toast('ارسال نشد: '+e)}}
const vacPaid=()=>Q(`SELECT v.name vname,v.amount,a.name aname,a.type,o.phone,o.name oname FROM vacc v JOIN animals a ON a.id=v.aid JOIN owners o ON o.phone=a.phone WHERE v.date=? AND v.amount>0`,[day]);

try{await T([{statement:"UPDATE vacc SET state='done' WHERE id=?",values:[vid]},{statement:"INSERT INTO vacc(id,aid,name,date,due,state,amount) VALUES(?,?,?,?,?,?,?)",values:[nid,v.aid,v.name,TODAY(),'','none',n]}])}catch(e){return toast('خطا: '+(e.message||e))}
$('#ov').innerHTML=`<div class="sheet"><h3>✓ ${E(v.name)} در پرونده ثبت شد</h3><p style="color:var(--m)">موعد واکسن بعدی رو انتخاب کن تا ثبت بشه:</p><div class="row" style="margin-bottom:8px"><button class="s" onclick="setDp('nd',addD(TODAY(),21))">۳ هفته</button><button class="s" onclick="setDp('nd',addD(TODAY(),28))">۴ هفته</button><button class="s" onclick="setDp('nd',addD(TODAY(),365))">۱ سال</button></div>${dp('nd',addD(TODAY(),365))}<div class="row" style="margin-top:10px"><button class="p" onclick="saveNext('${nid}')">ثبت موعد بعدی</button><button onclick="cl();render()">فعلاً نه</button></div></div>`;$('#ov').style.display='block'}

function book(){lastPh='';$('#ov').innerHTML=`<div class="sheet"><div class="bar"><h3>نوبت جدید</h3><button class="s" onclick="cl()">✕</button></div><label>شماره تلفن صاحب</label><input id="bph" type="tel" oninput="look()"><div id="bo"></div></div>`;$('#ov').style.display='block'}

async function look(){const ph=EN($('#bph').value).replace(/\D/g,'');if(ph.length<10||ph==lastPh)return;lastPh=ph;const o=(await Q('SELECT * FROM owners WHERE phone=?',[ph]))[0]||{name:'',gender:''};o.animals=await Q('SELECT id,type,name FROM animals WHERE phone=? ORDER BY rowid',[ph]);
$('#bo').innerHTML=`<label>نام صاحب</label><input id="bn" value="${E(o.name)}"><label>آقا / خانم</label><select id="bg">${opt(['','آقا','خانم'],o.gender)}</select>${o.animals.length?`<label>حیوان</label><select id="ba" onchange="$('#nw').style.display=this.value=='new'?'block':'none'">${o.animals.map(a=>`<option value="${a.id}">${E(a.type)} ${E(a.name)}</option>`).join('')}<option value="new">+ حیوان جدید</option></select>`:''}<div id="nw" style="display:${o.animals.length?'none':'block'}"><label>نوع حیوان</label><select id="bt2">${opt(TY)}</select><label>اسم حیوان (اختیاری)</label><input id="bnm"></div><label>نوع نوبت</label><select id="bk" onchange="slots()"><option value="exam">معاینه</option><option value="surgery">جراحی</option></select><label>تاریخ</label>${dp('bd',day,'slots()')}<div id="sl"></div><label><input type="checkbox" id="bs" checked style="width:auto"> ارسال پیامک</label><button class="p" style="width:100%" onclick="bookSave('${ph}')">ثبت نوبت</button>`;slots()}
async function slots(){const d=dpv('bd'),k=$('#bk').value,st=ST(),sg=k=='surgery',w0=Number(st.wS)*60,w1=Number(st.wE)*60;if(!d){$('#sl').innerHTML='';return}
SLR=await Q("SELECT x.time,x.dur,x.kind,o.name FROM appts x LEFT JOIN owners o ON o.phone=x.phone WHERE x.date=? AND x.kind=? AND x.st!='cancel' ORDER BY x.time",[d,k]);
if(!sg){const de=Number(st.dExam)||20;let h=`<label>ساعت (از ${FA(st.wS)} تا ${FA(st.wE)}) — قرمز = پر</label><input type="hidden" id="btm"><div class="slots">`;for(let m=w0;m+de<=w1;m+=de){const b=SLR.find(r=>m<mins(r.time)+dd(r,k)&&mins(r.time)<m+de);h+=b?`<div class="sl busy"><b>${FA(hm(m))}</b><small>${E((b.name||'پر').slice(0,9))}</small></div>`:`<div class="sl" onclick="pick(this,'${hm(m)}')"><b>${FA(hm(m))}</b><small>آزاد</small></div>`}$('#sl').innerHTML=h+'</div>';return}
$('#sl').innerHTML=`<label>ساعت شروع</label><input type="time" id="btm" step="300" oninput="bar()"><label>مدت (دقیقه)</label><select id="bdur" onchange="bar()">${[60,90,120,150,180,240].map(v=>`<option ${v==(Number(st.dSurg)||120)?'selected':''}>${v}</option>`).join('')}</select><div id="bar"></div>`;bar()}
function pick(el,t){document.querySelectorAll('.sl.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');$('#btm').value=t}
function bar(){const st=ST(),w0=Number(st.wS)*60,w1=Number(st.wE)*60,t=$('#btm').value,dur=Number($('#bdur').value),pc=m=>Math.max(0,Math.min(100,(m-w0)/(w1-w0)*100)),sg=(a,b,c)=>`<i style="left:${pc(a)}%;width:${pc(b)-pc(a)}%;background:${c}"></i>`;let nw='';if(t){const s0=mins(t),ok=!SLR.find(r=>s0<mins(r.time)+dd(r,'surgery')&&mins(r.time)<s0+dur);nw=sg(s0,s0+dur,ok?'#a8e6cf':'#ff6b81')}
const lb=[];for(let h=Number(st.wS);h<=Number(st.wE);h+=2)lb.push(`<span>${FA(h)}</span>`);
$('#bar').innerHTML=`<div class="tb" dir="ltr">${SLR.map(r=>sg(mins(r.time),mins(r.time)+dd(r,'surgery'),'#ffadb8')).join('')}${nw}</div><div class="tbl" dir="ltr">${lb.join('')}</div><small style="color:var(--m)">${SLR.length?'پر: '+SLR.map(r=>FA(r.time)+' تا '+FA(hm(mins(r.time)+dd(r,'surgery')))+' ('+E(r.name||'')+')').join('، '):'جراحی‌ای در این روز ثبت نشده'}</small>`}
async function bookSave(ph){const k=$('#bk').value,d=dpv('bd'),t=$('#btm')?$('#btm').value:'',st=ST(),sg=k=='surgery',dur=sg?Number($('#bdur').value)||Number(st.dSurg)||120:Number(st.dExam)||20;if(!t||!d)return toast(sg?'ساعت شروع را وارد کن':'یک ساعت از لیست انتخاب کن');const s=mins(t);
if((await Q("SELECT time,dur,kind FROM appts WHERE date=? AND kind=? AND st!='cancel'",[d,k])).find(x=>s<mins(x.time)+dd(x,k)&&mins(x.time)<s+dur))return toast('این بازه برای این دکتر پر است');

let aid=sel,an;if(sel=='new'){aid=uid();const ty=$('#bt2').value,n2=$('#bnm').value.trim();an=n2||ty;set.push({statement:'INSERT INTO animals(id,phone,type,name) VALUES(?,?,?,?)',values:[aid,ph,ty,n2]})}else an=$('#ba').selectedOptions[0].text.trim();
set.push({statement:'INSERT INTO appts(id,phone,aid,kind,date,time,dur,st) VALUES(?,?,?,?,?,?,?,?)',values:[uid(),ph,aid,k,d,t,dur,'wait']});
const sm=$('#bs').checked;try{await T(set)}catch(e){return fail('خطای ذخیره نوبت',e)}day=d;tab='tl';cl();render();
if(sm)try{await sendSms(ph,fill(st.tBook,{title:g,name:nm,kind:sg?'جراحی':'معاینه',animal:an,date:jd(d),time:FA(t),clinic:st.clinic}));toast('نوبت ثبت و پیامک ارسال شد')}catch(e){toast('نوبت ثبت شد، پیامک نرفت: '+e)}else toast('نوبت ثبت شد')}
/* ---------- files ---------- */
function vFL(){return `<h2>پرونده‌ها</h2><input id="q" placeholder="شماره، نام صاحب یا اسم حیوان" oninput="res()"><label><input type="checkbox" id="qi" onchange="res()" style="width:auto"> فقط ناقص‌ها</label><div id="rs"></div>`}
async function res(){const w=EN($('#q').value).trim(),l='%'+w+'%',r=await Q(`SELECT o.phone,o.name,${INC} incx,(SELECT group_concat(type||' '||name,'، ') FROM animals WHERE phone=o.phone) an,(SELECT group_concat(t.tag,'|') FROM atags t JOIN animals z ON z.id=t.aid WHERE z.phone=o.phone) tg FROM owners o WHERE (?='' OR o.phone LIKE ? OR o.name LIKE ? OR EXISTS(SELECT 1 FROM animals WHERE phone=o.phone AND name LIKE ?)) ${$('#qi').checked?'AND '+INC:''} ORDER BY o.name LIMIT 60`,[w,l,l,l]);
$('#rs').innerHTML=r.map(o=>`<div class="card" onclick="openFile('${o.phone}')"><b>${E(o.name)||'—'}</b> ${o.incx?'<span class="tag inc">ناقص</span>':''}<div style="color:var(--m)">${FA(o.phone)} · ${E(o.an)} ${tgh(o.tg)}</div></div>`).join('')||'<p>چیزی پیدا نشد</p>'}
const gv=p=>p.split('.').reduce((a,k)=>a&&a[k],F);
function S(p,v){const k=p.split('.'),l=k.pop();k.reduce((a,x)=>a[x],F)[l]=v}
const fld=(l,p,o)=>`<label>${l}</label>`+(o?`<select onchange="S('${p}',this.value)">${opt(o,gv(p))}</select>`:`<input value="${E(gv(p))}" oninput="S('${p}',this.value)">`);
async function openFile(ph){await loadTags();const o=(await Q('SELECT * FROM owners WHERE phone=?',[ph]))[0];o.animals=await Q('SELECT * FROM animals WHERE phone=? ORDER BY rowid',[ph]);for(const a of o.animals){a.vacc=await Q('SELECT * FROM vacc WHERE aid=? ORDER BY date',[a.id]);a.hist=await Q('SELECT * FROM hist WHERE aid=? ORDER BY date',[a.id]);a.tags=(await Q('SELECT tag FROM atags WHERE aid=?',[a.id])).map(x=>x.tag)}F=o;drawFile()}
function tgl(i,j){const n=TAGS[j].name,t=F.animals[i].tags||(F.animals[i].tags=[]),k=t.indexOf(n);k<0?t.push(n):t.splice(k,1);drawFile()}
async function newTag(i){const n=$('#nt'+i).value.trim().replace(/['"`|<>]/g,'');if(!n)return;if(!TAGS.find(t=>t.name==n)){const c=TAGS.length%6;await X('INSERT OR IGNORE INTO tags(name,color) VALUES(?,?)',[n,c]);TAGS.push({name:n,color:c})}const t=F.animals[i].tags||(F.animals[i].tags=[]);if(!t.includes(n))t.push(n);drawFile()}
function drawFile(){const o=F;$('#ov').innerHTML=`<div id="pdf2" class="sheet"><div class="bar no"><h3>پرونده</h3><button class="s" onclick="cl()">✕</button></div><div>📞 ${FA(o.phone)}</div>${fld('نام صاحب','name')}${fld('آقا / خانم','gender',['','آقا','خانم'])}${fld('توضیحات','note')}
${o.animals.map((a,i)=>{const q='animals.'+i+'.';return `<div class="card"><h3>${E(a.type)} ${E(a.name)}</h3><label>برچسب‌ها (برای انتخاب بزن)</label><div>${TAGS.map((t,j)=>`<span class="tg c${t.color} ${(a.tags||[]).includes(t.name)?'':'off'}" onclick="tgl(${i},${j})">${E(t.name)}</span>`).join('')}</div><div class="row no" style="margin:6px 0"><input id="nt${i}" placeholder="برچسب جدید، مثلاً پرخاشگر" style="flex:1;margin:0"><button class="s" onclick="newTag(${i})">+</button></div>${fld('نوع',q+'type',TY)}${fld('اسم',q+'name')}${fld('نژاد',q+'breed')}${fld('جنس',q+'sex',['','نر','ماده'])}${fld('سن / تاریخ تولد',q+'birth')}${fld('وزن (kg)',q+'weight')}${fld('عقیم شده',q+'neu',['','بله','خیر'])}${fld('آلرژی / بیماری زمینه‌ای',q+'allergy')}${fld('یادداشت',q+'note')}
<b>واکسن‌ها</b>${a.vacc.map(v=>`<div>${v.state=='done'?'✓ ':''}${E(v.name)} · ${jd(v.date)}${v.due?' · بعدی: '+jd(v.due):''}</div>`).join('')}
<div class="no"><input id="vn${i}" placeholder="نام واکسن"><label>تاریخ تزریق</label>${dp('vd'+i,TODAY())}<label>موعد بعدی (اختیاری)</label>${dp('vu'+i,'')}<button class="s" onclick="addV(${i})">+ واکسن</button></div>
<b>سابقه ویزیت / جراحی</b>${a.hist.map(h=>`<div>${jd(h.date)} · ${h.type}: ${E(h.diag)} ${h.drug?'· دارو: '+E(h.drug):''} ${E(h.note)}</div>`).join('')}
<div class="no"><label>تاریخ</label>${dp('hd'+i,TODAY())}<select id="hk${i}"><option>معاینه</option><option>جراحی</option></select><input id="hg${i}" placeholder="تشخیص"><input id="hr${i}" placeholder="دارو"><input id="hn${i}" placeholder="یادداشت"><button class="s" onclick="addH(${i})">+ ثبت سابقه</button></div></div>`}).join('')}
<div class="row no"><button class="s" onclick="F.animals.push({id:uid(),type:'سگ',name:'',vacc:[],hist:[]});drawFile()">+ حیوان</button><button class="s" onclick="pdfFile()">PDF پرونده</button><button class="p" onclick="saveF()">ذخیره</button></div></div>`;$('#ov').style.display='block'}
function addV(i){const n=$('#vn'+i).value.trim();if(!n)return toast('نام واکسن را بنویس');const u=dpv('vu'+i);F.animals[i].vacc.push({id:uid(),name:n,date:dpv('vd'+i)||TODAY(),due:u,state:u?'pending':'none',amount:0});drawFile()}
function addH(i){F.animals[i].hist.push({date:dpv('hd'+i)||TODAY(),type:$('#hk'+i).value,diag:$('#hg'+i).value,drug:$('#hr'+i).value,note:$('#hn'+i).value});drawFile()}
async function saveF(){const f=F,p=f.phone,v=x=>x||'',set=[{statement:'INSERT OR IGNORE INTO owners(phone) VALUES(?)',values:[p]},{statement:'UPDATE owners SET name=?,gender=?,note=? WHERE phone=?',values:[v(f.name),v(f.gender),v(f.note),p]}];
for(const a of f.animals){set.push({statement:'INSERT OR REPLACE INTO animals(id,phone,type,name,breed,sex,birth,weight,neu,allergy,note) VALUES(?,?,?,?,?,?,?,?,?,?,?)',values:[a.id,p,v(a.type),v(a.name),v(a.breed),v(a.sex),v(a.birth),v(a.weight),v(a.neu),v(a.allergy),v(a.note)]});set.push({statement:'DELETE FROM atags WHERE aid=?',values:[a.id]});for(const t of a.tags||[])set.push({statement:'INSERT OR IGNORE INTO atags(aid,tag) VALUES(?,?)',values:[a.id,t]});for(const x of a.vacc)set.push({statement:'INSERT OR REPLACE INTO vacc(id,aid,name,date,due,state,amount) VALUES(?,?,?,?,?,?,?)',values:[x.id,a.id,x.name,x.date,v(x.due),x.state,x.amount||0]});for(const h of a.hist)set.push(h.id?{statement:'INSERT OR REPLACE INTO hist(id,aid,date,type,diag,drug,note) VALUES(?,?,?,?,?,?,?)',values:[h.id,a.id,h.date,h.type,v(h.diag),v(h.drug),v(h.note)]}:{statement:'INSERT INTO hist(aid,date,type,diag,drug,note) VALUES(?,?,?,?,?,?)',values:[a.id,h.date,h.type,v(h.diag),v(h.drug),v(h.note)]})}
try{await T(set)}catch(e){return fail('خطای ذخیره پرونده',e)}cl();render();
const done=f.name&&f.gender&&f.animals.length&&f.animals.every(a=>a.breed&&a.sex&&a.birth);
if(done&&!f.notified){const s=ST();try{await sendSms(p,fill(s.tDone,{title:f.gender,name:f.name,animal:f.animals.map(a=>a.name||a.type).join('، '),clinic:s.clinic}));await X('UPDATE owners SET notified=1 WHERE phone=?',[p]);toast('ذخیره شد و پیامک تکمیل پرونده رفت')}catch(e){toast('ذخیره شد، پیامک نرفت: '+errs(e))}}else toast('ذخیره شد')}
/* ---------- settings ---------- */
const SK=[['clinic','نام کلینیک'],['wS','ساعت شروع کار (۰ تا ۲۴)'],['wE','ساعت پایان کار (۰ تا ۲۴)'],['docExam','نام دکتر معاینه'],['docSurg','نام دکتر جراحی'],['dExam','مدت معاینه (دقیقه)'],['dSurg','مدت پیش‌فرض جراحی (دقیقه)']];
async function vST(){const s=ST(),n=(await Q('SELECT COUNT(*) c FROM owners'))[0].c;return `<h2>تنظیمات</h2><div class="card">${SK.map(([k,l])=>`<label>${l}</label><input id="s_${k}" value="${E(s[k])}">`).join('')}<label>قالب پیامک ثبت نوبت</label><textarea id="s_tBook" rows="3">${E(s.tBook)}</textarea><label>قالب پیامک واکسن</label><textarea id="s_tVac" rows="3">${E(s.tVac)}</textarea><label>قالب پیامک تکمیل پرونده (فقط یک‌بار)</label><textarea id="s_tDone" rows="3">${E(s.tDone)}</textarea><small style="color:var(--m)">متغیرها: {title} {name} {animal} {kind} {date} {time} {clinic} {vaccine}</small><button class="p" style="width:100%;margin-top:8px" onclick="saveS()">ذخیره</button></div><div class="card" style="color:var(--m)">تعداد پرونده: ${FA(n)}<br>دیتابیس: SQLite. نسخه پشتیبان خودکار (خود فایل دیتابیس): Documents/KoochakzadehClinic/clinic.db<div class="row" style="margin-top:8px"><button class="s" onclick="backup(1).then(()=>toast('بکاپ گرفته شد')).catch(e=>fail('بکاپ',e))">بکاپ همین الان</button><button class="s r" onclick="restore()">بازیابی از بکاپ</button><button class="s" onclick="diag()">تشخیص مشکل ذخیره‌سازی</button></div><pre id="dg" style="white-space:pre-wrap;font-size:12px"></pre></div>`}
async function saveS(){const ks=[...SK.map(x=>x[0]),'tBook','tVac','tDone'],set=ks.map(k=>({statement:'INSERT OR REPLACE INTO settings(k,v) VALUES(?,?)',values:[k,['dExam','dSurg','wS','wE'].includes(k)?EN($('#s_'+k).value):$('#s_'+k).value]}));try{await T(set);await loadSets();toast('تنظیمات ذخیره شد')}catch(e){fail('خطای تنظیمات',e)}}
async function diag(){const o=[],t=async(n,f)=>{try{const r=await f();o.push('✅ '+n+(r?': '+r:''))}catch(e){o.push('❌ '+n+': '+errs(e))}$('#dg').textContent=o.join('\n')};
await t('Capacitor',async()=>window.Capacitor?Capacitor.getPlatform():Promise.reject('وجود ندارد'));
await t('اتصال و ساخت جدول‌ها',async()=>{await initDb();return 'ok'});
await t('نوشتن و خواندن',async()=>{await X('INSERT OR REPLACE INTO settings(k,v) VALUES(?,?)',['_t','1']);return JSON.stringify(await Q('SELECT v FROM settings WHERE k=?',['_t']))});
await t('تراکنش',async()=>{await T([{statement:'INSERT OR REPLACE INTO settings(k,v) VALUES(?,?)',values:['_t2','2']}]);return 'ok'});
await t('پوشه فایل‌ها',async()=>{const d=await probeDir();if(!d)throw new Error('هیچ پوشه‌ای قابل نوشتن نیست');return d});
await t('کپی دیتابیس',async()=>{await backup(1);return 'ok'})}
/* ---------- start ---------- */
(async()=>{try{await FS().requestPermissions()}catch(e){}
try{await probeDir();await initDb();await loadSets();if(!(await Q('SELECT 1 FROM owners LIMIT 1')).length)try{if(await bkPick()&&confirm('بکاپ قبلی پیدا شد. بازیابی بشه؟'))await restore(true)}catch(e){}}catch(e){fail('خطای دیتابیس',e)}
render()})();
document.addEventListener('visibilitychange',()=>{if(document.hidden)backup()});
</script></body></html>

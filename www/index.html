<script>
const $=s=>document.querySelector(s),P=n=>String(n).padStart(2,'0');
const FA=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const EN=s=>String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MN='فروردین اردیبهشت خرداد تیر مرداد شهریور مهر آبان آذر دی بهمن اسفند'.split(' ');
const WD='یکشنبه دوشنبه سه‌شنبه چهارشنبه پنجشنبه جمعه شنبه'.split(' ');
const TY=['سگ','گربه','پرنده','دیگر'];
const iso=d=>d.getFullYear()+'-'+P(d.getMonth()+1)+'-'+P(d.getDate());
const iso2=a=>a[0]+'-'+P(a[1])+'-'+P(a[2]);
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const TODAY=()=>iso(new Date());
function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334],y2=gm>2?gy+1:gy;let days=355666+365*gy+Math.floor((y2+3)/4)-Math.floor((y2+99)/100)+Math.floor((y2+399)/400)+gd+g[gm-1];let jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30),jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:((jm-7)*30)+186);let gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const sal=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13&&gd>sal[gm];gm++)gd-=sal[gm];return[gy,gm,gd]}
const J=s=>g2j(...s.split('-').map(Number));
const jd=s=>{const[y,m,d]=J(s);return FA(d)+' '+MN[m-1]+' '+FA(y)};
const DEF={clinic:'کلینیک دامپزشکی دکتر کوچک زاده',docExam:'دکتر معاینه',docSurg:'دکتر جراحی',dExam:20,dSurg:120,tBook:'{title} {name}، نوبت {kind} {animal} در تاریخ {date} ساعت {time} در {clinic} ثبت شد.',tVac:'{title} {name}، موعد واکسن {vaccine} {animal} در تاریخ {date} است. {clinic}',tDone:'{title} {name}، پرونده دیجیتال {animal} در {clinic} تکمیل شد. از اعتماد شما سپاسگزاریم.'};
let F=null,day=TODAY(),tab='tl',lastPh='';
const ST=()=>Object.assign({},DEF,SETS);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const hm=n=>P(Math.floor(n/60)%24)+':'+P(n%60);
const ttl=o=>o.gender||'';
const fill=(t,v)=>t.replace(/\{(\w+)\}/g,(m,k)=>v[k]==null?'':v[k]).replace(/\s+/g,' ').trim();
const opt=(a,s)=>a.map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join('');
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,3500)}
const NOWT=()=>{const d=new Date();return P(d.getHours())+':'+P(d.getMinutes())};
const NOWJ=()=>jd(TODAY())+' ساعت '+FA(NOWT());
const NM=x=>EN(String(x||'')).replace(/\D/g,'');
const TM=x=>{const n=Number(NM(x)||0);return FA(n.toLocaleString('en-US')).replace(/,/g,'٬')};
const WOPEN=600,WCLOSE=1320,STEP=20;
/* ---------- storage ---------- */
const FS=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Filesystem;
const SQ=()=>window.Capacitor.Plugins.CapacitorSQLite;
const DBN='clinic';
const HAS_SQL=()=>{try{return !!(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorSQLite)}catch(e){return false}};
let MEM=null;
function memLoad(){try{const r=localStorage.getItem('clinic_mem_v1');if(r){MEM=JSON.parse(r);return}}catch(e){}MEM={owners:[],animals:[],vacc:[],hist:[],appts:[],settings:{},tags:[{name:'پرخاشگر',color:0},{name:'ترسو',color:4}],atags:[]};}
function memSave(){try{localStorage.setItem('clinic_mem_v1',JSON.stringify(MEM))}catch(e){}}
function memInit(){if(!MEM)memLoad();if(!MEM.tags||!MEM.tags.length)MEM.tags=[{name:'پرخاشگر',color:0},{name:'ترسو',color:4}];if(!MEM.settings)MEM.settings={};if(!MEM.owners)MEM.owners=[];if(!MEM.animals)MEM.animals=[];if(!MEM.vacc)MEM.vacc=[];if(!MEM.hist)MEM.hist=[];if(!MEM.appts)MEM.appts=[];if(!MEM.atags)MEM.atags=[];memSave();}
let SETS={},TAGS=[],TAGC={};
const SCHEMA=`CREATE TABLE IF NOT EXISTS owners(phone TEXT PRIMARY KEY,name TEXT NOT NULL DEFAULT '',gender TEXT NOT NULL DEFAULT '',note TEXT NOT NULL DEFAULT '',notified INTEGER NOT NULL DEFAULT 0);
CREATE TABLE IF NOT EXISTS animals(id TEXT PRIMARY KEY,phone TEXT NOT NULL,type TEXT NOT NULL DEFAULT '',name TEXT NOT NULL DEFAULT '',breed TEXT NOT NULL DEFAULT '',sex TEXT NOT NULL DEFAULT '',birth TEXT NOT NULL DEFAULT '',weight TEXT NOT NULL DEFAULT '',neu TEXT NOT NULL DEFAULT '',allergy TEXT NOT NULL DEFAULT '',note TEXT NOT NULL DEFAULT '');
CREATE INDEX IF NOT EXISTS ix_an_ph ON animals(phone);
CREATE INDEX IF NOT EXISTS ix_an_nm ON animals(name);
CREATE TABLE IF NOT EXISTS vacc(id TEXT PRIMARY KEY,aid TEXT NOT NULL,name TEXT NOT NULL DEFAULT '',date TEXT NOT NULL DEFAULT '',due TEXT NOT NULL DEFAULT '',state TEXT NOT NULL DEFAULT 'none');
CREATE INDEX IF NOT EXISTS ix_v_aid ON vacc(aid);
CREATE INDEX IF NOT EXISTS ix_v_st ON vacc(state,due);
CREATE TABLE IF NOT EXISTS hist(id INTEGER PRIMARY KEY AUTOINCREMENT,aid TEXT NOT NULL,date TEXT NOT NULL DEFAULT '',type TEXT NOT NULL DEFAULT '',diag TEXT NOT NULL DEFAULT '',drug TEXT NOT NULL DEFAULT '',note TEXT NOT NULL DEFAULT '');
CREATE INDEX IF NOT EXISTS ix_h_aid ON hist(aid);
CREATE TABLE IF NOT EXISTS appts(id TEXT PRIMARY KEY,phone TEXT NOT NULL,aid TEXT NOT NULL DEFAULT '',kind TEXT NOT NULL DEFAULT 'exam',date TEXT NOT NULL,time TEXT NOT NULL,st TEXT NOT NULL DEFAULT 'wait',fee TEXT NOT NULL DEFAULT '',dur INTEGER NOT NULL DEFAULT 0);
CREATE INDEX IF NOT EXISTS ix_ap_d ON appts(date,kind);
CREATE TABLE IF NOT EXISTS settings(k TEXT PRIMARY KEY,v TEXT);
CREATE TABLE IF NOT EXISTS tags(name TEXT PRIMARY KEY,color INTEGER NOT NULL DEFAULT 5);
CREATE TABLE IF NOT EXISTS atags(aid TEXT NOT NULL,tag TEXT NOT NULL,PRIMARY KEY(aid,tag));
INSERT OR IGNORE INTO tags(name,color) VALUES('پرخاشگر',0),('ترسو',4);`;
const Q=async(s,v=[])=>{if(HAS_SQL()){try{const r=await SQ().query({database:DBN,statement:s,values:v||[]});return (r&&r.values)||[]}catch(e){}}return QF(s,v||[])};
async function QF(s,v){
  if(!MEM)memInit();v=v||[];
  const q=(s||'').replace(/\s+/g,' ').trim();
  if(q.startsWith('SELECT 1 FROM owners')){return MEM.owners.length?[{one:1}]:[]}
  if(q.startsWith('SELECT COUNT(*) c FROM owners')){return[{c:MEM.owners.length}]}
  if(q.startsWith('SELECT k,v FROM settings')){return Object.entries(MEM.settings||{}).map(([k,vv])=>({k,v:vv}))}
  if(q.startsWith('SELECT name,color FROM tags')){return (MEM.tags||[]).slice()}
  if(q.startsWith('SELECT * FROM owners WHERE phone=?')){const ph=v[0];return MEM.owners.filter(o=>o.phone==ph)}
  if(q.startsWith('SELECT id,type,name FROM animals WHERE phone=?')){const ph=v[0];return MEM.animals.filter(a=>a.phone==ph)}
  if(q.startsWith('SELECT * FROM animals WHERE phone=?')){const ph=v[0];return MEM.animals.filter(a=>a.phone==ph)}
  if(q.startsWith('SELECT time,dur FROM appts WHERE date=?')){const[d,k]=v;return MEM.appts.filter(r=>r.date==d&&r.kind==k&&r.st!='cancel').map(r=>({time:r.time,dur:r.dur}))}
  if(q.startsWith('SELECT time FROM appts WHERE date=?')){const[d,k]=v;return MEM.appts.filter(r=>r.date==d&&r.kind==k&&r.st!='cancel').map(r=>({time:r.time}))}
  if(q.startsWith('SELECT * FROM vacc WHERE aid=?')){const aid=v[0];return MEM.vacc.filter(x=>x.aid==aid).sort((a,b)=>(a.date||'').localeCompare(b.date||''))}
  if(q.startsWith('SELECT * FROM hist WHERE aid=?')){const aid=v[0];return MEM.hist.filter(x=>x.aid==aid).sort((a,b)=>(a.date||'').localeCompare(b.date||''))}
  if(q.startsWith('SELECT tag FROM atags WHERE aid=?')){const aid=v[0];return MEM.atags.filter(x=>x.aid==aid)}
  if(q.startsWith('SELECT phone FROM appts WHERE id=?')){const id=v[0];const f=MEM.appts.find(r=>r.id==id);return f?[{phone:f.phone}]:[]}
  if(q.includes('FROM appts x LEFT JOIN owners')){
    const dd=v[0];
    let arr=MEM.appts.filter(r=>r.date==dd&&r.st!='cancel').sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    return arr.map(x=>{
      const o=MEM.owners.find(o=>o.phone==x.phone)||{name:'',gender:''};
      const a=MEM.animals.find(a=>a.id==x.aid)||{type:'',name:''};
      const tg=MEM.atags.filter(t=>t.aid==x.aid).map(t=>t.tag).join('|');
      let incx=0;
      if(!o.name||!o.gender)incx=1;
      else{const zs=MEM.animals.filter(z=>z.phone==o.phone);if(zs.some(z=>!z.breed||!z.sex||!z.birth))incx=1}
      return Object.assign({},x,{oname:o.name||'',atype:a.type||'',aname:a.name||'',tg:tg||'',incx});
    });
  }
  if(q.includes('FROM vacc v JOIN animals a')&&q.includes("v.state='sent' OR")){
    const thr=v[0];
    let arr=MEM.vacc.filter(x=>x.state=='sent'||(x.state=='pending'&&x.due&&x.due<=thr));
    let out=arr.map(vv=>{
      const a=MEM.animals.find(a=>a.id==vv.aid);if(!a)return null;
      const o=MEM.owners.find(o=>o.phone==a.phone);if(!o)return null;
      const tg=MEM.atags.filter(t=>t.aid==a.id).map(t=>t.tag).join('|');
      return{vid:vv.id,vname:vv.name,vdue:vv.due,due:vv.due,state:vv.state,aname:a.name,type:a.type,tg,phone:o.phone,oname:o.name};
    }).filter(Boolean);
    out.sort((A,B)=>((A.state=='sent'?1:0)-(B.state=='sent'?1:0))||(A.due||'').localeCompare(B.due||''));
    return out;
  }
  if(q.includes('FROM vacc v JOIN animals a')&&q.includes('WHERE v.id=?')){
    const vid=v[0];const vv=MEM.vacc.find(x=>x.id==vid);if(!vv)return[];
    const a=MEM.animals.find(a=>a.id==vv.aid)||{};const o=MEM.owners.find(o=>o.phone==a.phone)||{};
    return[{vname:vv.name,vdue:vv.due,due:vv.due,aname:a.name,type:a.type,phone:o.phone,oname:o.name,gender:o.gender}];
  }
  if(q.includes('FROM owners o WHERE')&&q.includes('group_concat')){
    const w=(v[0]||'').toString().trim();
    const onlyInc=q.includes('AND (o.name');
    let list=MEM.owners.slice();
    if(w!==''){list=list.filter(o=>{if((o.phone||'').includes(w))return true;if((o.name||'').includes(w))return true;const ans=MEM.animals.filter(a=>a.phone==o.phone);if(ans.some(a=>(a.name||'').includes(w)))return true;return false})}
    let out=list.map(o=>{
      const ans=MEM.animals.filter(a=>a.phone==o.phone);
      let incx=0;if(!o.name||!o.gender)incx=1;else if(ans.some(z=>!z.breed||!z.sex||!z.birth))incx=1;
      const an=ans.map(a=>((a.type||'')+' '+(a.name||'')).trim()).filter(Boolean).join('، ');
      const aids=new Set(ans.map(a=>a.id));
      const tg=MEM.atags.filter(t=>aids.has(t.aid)).map(t=>t.tag).join('|');
      return{phone:o.phone,name:o.name||'',incx,an:an||'',tg:tg||''};
    });
    if(onlyInc)out=out.filter(o=>o.incx);
    out.sort((a,b)=>(a.name||'').localeCompare(b.name||'','fa'));
    return out.slice(0,60);
  }
  return[];
}
let bt;const bk=()=>{clearTimeout(bt);bt=setTimeout(backup,2500)};
const X=async(s,v=[])=>{if(HAS_SQL()){try{await SQ().run({database:DBN,statement:s,values:v||[]});bk();return}catch(e){}}await XF(s,v||[]);bk()};
async function XF(s,v){
  if(!MEM)memInit();v=v||[];
  const q=(s||'').replace(/\s+/g,' ').trim();
  if(q.startsWith("UPDATE vacc SET state='sent'")){const id=v[0];const f=MEM.vacc.find(x=>x.id==id);if(f)f.state='sent';memSave();return}
  if(q.startsWith('UPDATE vacc SET state=')){const[st,id]=v;const f=MEM.vacc.find(x=>x.id==id);if(f)f.state=st;memSave();return}
  if(q.startsWith("UPDATE appts SET st='arr'")){const id=v[0];const f=MEM.appts.find(x=>x.id==id);if(f)f.st='arr';memSave();return}
  if(q.startsWith("UPDATE appts SET st='cancel'")){const id=v[0];const f=MEM.appts.find(x=>x.id==id);if(f)f.st='cancel';memSave();return}
  if(q.startsWith('UPDATE appts SET st=')){const[st,id]=v;const f=MEM.appts.find(x=>x.id==id);if(f)f.st=st;memSave();return}
  if(q.startsWith('UPDATE appts SET fee=')){const[fee,id]=v;const f=MEM.appts.find(x=>x.id==id);if(f)f.fee=fee;memSave();return}
  if(q.startsWith('UPDATE owners SET notified=')){const ph=v[0];const o=MEM.owners.find(o=>o.phone==ph);if(o)o.notified=1;memSave();return}
  if(q.startsWith('INSERT OR IGNORE INTO tags')){const[nm,cl]=v;if(!MEM.tags.find(t=>t.name==nm))MEM.tags.push({name:nm,color:cl});memSave();return}
  await TF([{statement:s,values:v}]);
}
const T=async set=>{if(HAS_SQL()){try{await SQ().executeSet({database:DBN,set,transaction:true});bk();return}catch(e){}}await TF(set);bk()};
async function TF(set){
  if(!MEM)memInit();
  for(const it of (set||[])){
    const s=it.statement||'';const vv=it.values||[];
    const q=s.replace(/\s+/g,' ').trim();
    if(q.startsWith('INSERT OR IGNORE INTO owners(phone)')){const ph=vv[0];if(!MEM.owners.find(o=>o.phone==ph))MEM.owners.push({phone:ph,name:'',gender:'',note:'',notified:0})}
    else if(q.startsWith('UPDATE owners SET name=?,gender=?,note=?')){const[nm,g,nt,ph]=vv;const o=MEM.owners.find(o=>o.phone==ph);if(o){o.name=nm||'';o.gender=g||'';o.note=nt||''}}
    else if(q.startsWith('UPDATE owners SET name=?,gender=?')){const[nm,g,ph]=vv;const o=MEM.owners.find(o=>o.phone==ph);if(o){o.name=nm||'';o.gender=g||''}}

async function pdfOut(html,name){
  const w=document.createElement('div');w.id='pp';w.innerHTML=html;document.body.appendChild(w);
  try{
    await document.fonts.ready;
    if(typeof html2canvas==='undefined')throw new Error('html2canvas لود نشد');
    const c=await html2canvas(w,{backgroundColor:'#fff',scale:2});
    const pxh=Math.floor(c.width*297/210);
    const JSLIB=(window.jspdf&&window.jspdf.jsPDF)||(typeof jspdf!=='undefined'&&jspdf.jsPDF);
    if(!JSLIB)throw new Error('jspdf لود نشد');
    const d=new JSLIB({unit:'mm',format:'a4'});
    for(let y=0,i=0;y<c.height;y+=pxh,i++){
      const sc=document.createElement('canvas');sc.width=c.width;sc.height=Math.min(pxh,c.height-y);
      const g=sc.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,sc.width,sc.height);
      g.drawImage(c,0,y,c.width,sc.height,0,0,c.width,sc.height);
      if(i)d.addPage();d.addImage(sc.toDataURL('image/jpeg',.92),'JPEG',0,0,210,sc.height*210/c.width);
    }
    const b64=d.output('datauristring').split(',')[1];
    const f=FS();
    if(f&&HAS_SQL()){
      await f.writeFile({path:'KoochakzadehClinic/PDF/'+name+'.pdf',data:b64,directory:'DOCUMENTS',recursive:true});
      toast('PDF ذخیره شد: Documents/KoochakzadehClinic/PDF');
    }else{
      const a=document.createElement('a');a.href='data:application/pdf;base64,'+b64;a.download=name+'.pdf';document.body.appendChild(a);a.click();a.remove();
      toast('PDF دانلود شد');
    }
  }catch(e){toast('خطای PDF: '+(e.message||e))}
  w.remove();
}

  const old=await Q("SELECT time,dur FROM appts WHERE date=? AND kind=? AND st!='cancel'",[d,k]);
  if(old.find(x=>{let dd=+x.dur||Number(k=='surgery'?st.dSurg:st.dExam);return s<mins(x.time)+dd&&mins(x.time)<s+dur}))return toast('این بازه برای این دکتر پر است');
  const ex=(await Q('SELECT * FROM owners WHERE phone=?',[ph]))[0]||{name:'',gender:''};
  const nm=$('#bn').value.trim()||ex.name,g=$('#bg').value||ex.gender,sel=$('#ba')?$('#ba').value:'new';
  const set=[{statement:'INSERT OR IGNORE INTO owners(phone) VALUES(?)',values:[ph]},{statement:'UPDATE owners SET name=?,gender=? WHERE phone=?',values:[nm,g,ph]}];
  let aid=sel,an;
  if(sel=='new'){aid=uid();const ty=$('#bt2').value,n2=$('#bnm').value.trim();an=n2||ty;set.push({statement:'INSERT INTO animals(id,phone,type,name) VALUES(?,?,?,?)',values:[aid,ph,ty,n2]})}
  else an=$('#ba').selectedOptions[0].text.trim();
  set.push({statement:'INSERT INTO appts(id,phone,aid,kind,date,time,st,fee,dur) VALUES(?,?,?,?,?,?,?,?,?)',values:[uid(),ph,aid,k,d,t,'wait','',dur]});
  const sm=$('#bs').checked;
  try{await T(set)}catch(e){return toast('خطای ذخیره: '+(e.message||e))}
  day=d;tab='tl';cl();render();
  if(sm)try{await sendSms(ph,fill(st.tBook,{title:g,name:nm,kind:sg?'جراحی':'معاینه',animal:an,date:jd(d),time:FA(t),clinic:st.clinic}));toast('نوبت ثبت و پیامک ارسال شد')}catch(e){toast('نوبت ثبت شد، پیامک نرفت: '+e)}else toast('نوبت ثبت شد');
}
/* ---------- files ---------- */
function vFL(){return `<h2>پرونده‌ها</h2><input id="q" placeholder="شماره، نام صاحب یا اسم حیوان" oninput="res()"><label><input type="checkbox" id="qi" onchange="res()" style="width:auto"> فقط ناقص‌ها</label><div id="rs"></div>`}
async function res(){
  const w=EN($('#q').value).trim(),l='%'+w+'%';
  const onlyInc=$('#qi')&&$('#qi').checked;
  const r=await Q(`SELECT o.phone,o.name,${INC} incx,(SELECT group_concat(type||' '||name,'، ') FROM animals WHERE phone=o.phone) an,(SELECT group_concat(t.tag,'|') FROM atags t JOIN animals z ON z.id=t.aid WHERE z.phone=o.phone) tg FROM owners o WHERE (?='' OR o.phone LIKE ? OR o.name LIKE ? OR EXISTS(SELECT 1 FROM animals WHERE phone=o.phone AND name LIKE ?)) ${onlyInc?'AND '+INC:''} ORDER BY o.name LIMIT 60`,[w,l,l,l]);
  $('#rs').innerHTML=r.map(o=>`<div class="card" onclick="openFile('${o.phone}')"><b>${E(o.name)||'—'}</b> ${o.incx?'<span class="tag inc">ناقص</span>':''}<div style="color:var(--m)">${FA(o.phone)} · ${E(o.an)} ${tgh(o.tg)}</div></div>`).join('')||'<p>چیزی پیدا نشد</p>';
}
const gv=p=>p.split('.').reduce((a,k)=>a&&a[k],F);
function S(p,v){const k=p.split('.'),l=k.pop();k.reduce((a,x)=>a[x],F)[l]=v}
const fld=(l,p,o)=>`<label>${l}</label>`+(o?`<select onchange="S('${p}',this.value)">${opt(o,gv(p))}</select>`:`<input value="${E(gv(p))}" oninput="S('${p}',this.value)">`);
async function openFile(ph){
  await loadTags();
  const o=(await Q('SELECT * FROM owners WHERE phone=?',[ph]))[0];if(!o)return toast('پرونده پیدا نشد');
  o.animals=await Q('SELECT * FROM animals WHERE phone=? ORDER BY rowid',[ph]);
  for(const a of o.animals){a.vacc=await Q('SELECT * FROM vacc WHERE aid=? ORDER BY date',[a.id]);a.hist=await Q('SELECT * FROM hist WHERE aid=? ORDER BY date',[a.id]);a.tags=(await Q('SELECT tag FROM atags WHERE aid=?',[a.id])).map(x=>x.tag)}
  F=o;drawFile();
}
function tgl(i,j){const n=TAGS[j].name,t=F.animals[i].tags||(F.animals[i].tags=[]),k=t.indexOf(n);k<0?t.push(n):t.splice(k,1);drawFile()}
async function newTag(i){const n=$('#nt'+i).value.trim().replace(/['"`|<>]/g,'');if(!n)return;if(!TAGS.find(t=>t.name==n)){const c=TAGS.length%6;await X('INSERT OR IGNORE INTO tags(name,color) VALUES(?,?)',[n,c]);TAGS.push({name:n,color:c})}const t=F.animals[i].tags||(F.animals[i].tags=[]);if(!t.includes(n))t.push(n);drawFile()}
function drawFile(){
  const o=F;
  $('#ov').innerHTML=`<div id="pdf2" class="sheet"><div class="bar no"><h3>پرونده</h3><button class="s" onclick="cl()">✕</button></div><div>📞 ${FA(o.phone)}</div>${fld('نام صاحب','name')}${fld('آقا / خانم','gender',['','آقا','خانم'])}${fld('توضیحات','note')}
  ${o.animals.map((a,i)=>{const q='animals.'+i+'.';return `<div class="card"><h3>${E(a.type)} ${E(a.name)}</h3><label>برچسب‌ها (برای انتخاب بزن)</label><div>${TAGS.map((t,j)=>`<span class="tg c${t.color} ${(a.tags||[]).includes(t.name)?'':'off'}" onclick="tgl(${i},${j})">${E(t.name)}</span>`).join('')}</div><div class="row no" style="margin:6px 0"><input id="nt${i}" placeholder="برچسب جدید" style="flex:1;margin:0"><button class="s" onclick="newTag(${i})">+</button></div>${fld('نوع',q+'type',TY)}${fld('اسم',q+'name')}${fld('نژاد',q+'breed')}${fld('جنس',q+'sex',['','نر','ماده'])}${fld('سن / تاریخ تولد',q+'birth')}${fld('وزن (kg)',q+'weight')}${fld('عقیم شده',q+'neu',['','بله','خیر'])}${fld('آلرژی / بیماری زمینه‌ای',q+'allergy')}${fld('یادداشت',q+'note')}
  <b>واکسن‌ها</b>${a.vacc.map(v=>`<div>${E(v.name)} · ${jd(v.date)}${v.due?' · بعدی: '+jd(v.due):''}</div>`).join('')}
  <div class="no"><input id="vn${i}" placeholder="نام واکسن"><label>تاریخ تزریق</label>${dp('vd'+i,TODAY())}<label>موعد بعدی (اختیاری)</label>${dp('vu'+i,'')}<button class="s" onclick="addV(${i})">+ واکسن</button></div>
  <b>سابقه ویزیت / جراحی</b>${a.hist.map(h=>`<div>${jd(h.date)} · ${h.type}: ${E(h.diag)} ${h.drug?'· دارو: '+E(h.drug):''} ${E(h.note)}</div>`).join('')}
  <div class="no"><label>تاریخ</label>${dp('hd'+i,TODAY())}<select id="hk${i}"><option>معاینه</option><option>جراحی</option></select><input id="hg${i}" placeholder="تشخیص"><input id="hr${i}" placeholder="دارو"><input id="hn${i}" placeholder="یادداشت"><button class="s" onclick="addH(${i})">+ ثبت سابقه</button></div></div>`}).join('')}
  <div class="row no"><button class="s" onclick="F.animals.push({id:uid(),type:'سگ',name:'',vacc:[],hist:[]});drawFile()">+ حیوان</button><button class="s" onclick="pdfFile()">PDF پرونده</button><button class="p" onclick="saveF()">ذخیره</button></div></div>`;
  $('#ov').style.display='block';
}
function addV(i){const n=$('#vn'+i).value.trim();if(!n)return toast('نام واکسن را بنویس');const u=dpv('vu'+i);F.animals[i].vacc.push({id:uid(),name:n,date:dpv('vd'+i)||TODAY(),due:u,state:u?'pending':'none'});drawFile()}
function addH(i){F.animals[i].hist.push({date:dpv('hd'+i)||TODAY(),type:$('#hk'+i).value,diag:$('#hg'+i).value,drug:$('#hr'+i).value,note:$('#hn'+i).value});drawFile()}
async function saveF(){
  const f=F,p=f.phone,v=x=>x||'';
  const set=[{statement:'INSERT OR IGNORE INTO owners(phone) VALUES(?)',values:[p]},{statement:'UPDATE owners SET name=?,gender=?,note=? WHERE phone=?',values:[v(f.name),v(f.gender),v(f.note),p]},{statement:'DELETE FROM atags WHERE aid IN (SELECT id FROM animals WHERE phone=?)',values:[p]},{statement:'DELETE FROM vacc WHERE aid IN (SELECT id FROM animals WHERE phone=?)',values:[p]},{statement:'DELETE FROM hist WHERE aid IN (SELECT id FROM animals WHERE phone=?)',values:[p]},{statement:'DELETE FROM animals WHERE phone=?',values:[p]}];
  for(const a of f.animals){
    set.push({statement:'INSERT INTO animals(id,phone,type,name,breed,sex,birth,weight,neu,allergy,note) VALUES(?,?,?,?,?,?,?,?,?,?,?)',values:[a.id,p,v(a.type),v(a.name),v(a.breed),v(a.sex),v(a.birth),v(a.weight),v(a.neu),v(a.allergy),v(a.note)]});
    for(const t of a.tags||[])set.push({statement:'INSERT OR IGNORE INTO atags(aid,tag) VALUES(?,?)',values:[a.id,t]});
    for(const x of a.vacc)set.push({statement:'INSERT INTO vacc(id,aid,name,date,due,state) VALUES(?,?,?,?,?,?)',values:[x.id,a.id,x.name,x.date,v(x.due),x.state]});
    for(const h of a.hist)set.push({statement:'INSERT INTO hist(aid,date,type,diag,drug,note) VALUES(?,?,?,?,?,?)',values:[a.id,h.date,h.type,v(h.diag),v(h.drug),v(h.note)]});
  }
  try{await T(set)}catch(e){return toast('خطای ذخیره: '+(e.message||e))}
  cl();render();
  const done=f.name&&f.gender&&f.animals.length&&f.animals.every(a=>a.breed&&a.sex&&a.birth);
  if(done&&!f.notified){const s=ST();try{await sendSms(p,fill(s.tDone,{title:f.gender,name:f.name,animal:f.animals.map(a=>a.name||a.type).join('، '),clinic:s.clinic}));await X('UPDATE owners SET notified=1 WHERE phone=?',[p]);toast('ذخیره شد و پیامک تکمیل پرونده رفت')}catch(e){toast('ذخیره شد، پیامک نرفت: '+e)}}else toast('ذخیره شد');
}
/* ---------- settings ---------- */
const SK=[['clinic','نام کلینیک'],['docExam','نام دکتر معاینه'],['docSurg','نام دکتر جراحی'],['dExam','مدت معاینه (دقیقه)'],['dSurg','مدت جراحی (دقیقه)']];
async function vST(){
  const s=ST(),n=(await Q('SELECT COUNT(*) c FROM owners'))[0].c;
  return `<h2>تنظیمات</h2><div class="card">${SK.map(([k,l])=>`<label>${l}</label><input id="s_${k}" value="${E(s[k])}">`).join('')}<label>قالب پیامک ثبت نوبت</label><textarea id="s_tBook" rows="3">${E(s.tBook)}</textarea><label>قالب پیامک واکسن</label><textarea id="s_tVac" rows="3">${E(s.tVac)}</textarea><label>قالب پیامک تکمیل پرونده (فقط یک‌بار)</label><textarea id="s_tDone" rows="3">${E(s.tDone)}</textarea><small style="color:var(--m)">متغیرها: {title} {name} {animal} {kind} {date} {time} {clinic} {vaccine}</small><button class="p" style="width:100%;margin-top:8px" onclick="saveS()">ذخیره</button></div><div class="card" style="color:var(--m)">تعداد پرونده: ${FA(n||0)}<br>دیتابیس: ${HAS_SQL()?'SQLite':'حالت وب (تست)'} · پشتیبان خودکار: Documents/KoochakzadehClinic/clinic.db<div class="row" style="margin-top:8px"><button class="s" onclick="backup().then(()=>toast('بکاپ گرفته شد'))">بکاپ همین الان</button><button class="s r" onclick="restore()">بازیابی از بکاپ</button></div></div>`;
}
async function saveS(){
  const ks=[...SK.map(x=>x[0]),'tBook','tVac','tDone'];
  const set=[{statement:'DELETE FROM settings',values:[]}];
  ks.forEach(k=>set.push({statement:'INSERT INTO settings(k,v) VALUES(?,?)',values:[k,['dExam','dSurg'].includes(k)?EN($('#s_'+k).value):$('#s_'+k).value]}));
  try{await T(set);await loadSets();toast('تنظیمات ذخیره شد')}catch(e){toast('خطا: '+(e.message||e))}
}
/* ---------- start ---------- */
(async()=>{
  try{const f=FS();if(f&&f.requestPermissions){try{await f.requestPermissions()}catch(e){}}}catch(e){}
  try{
    await initDb();await loadSets();
    if(!(await Q('SELECT 1 FROM owners LIMIT 1')).length){
      if(HAS_SQL()){
        try{const f=FS();await f.stat({path:BKF,directory:'DOCUMENTS'});if(confirm('بکاپ قبلی پیدا شد. بازیابی بشه؟'))await restore(true)}catch(e){}
      }
    }
  }catch(e){toast('خطای دیتابیس: '+(e.message||e))}
  render();
})();
document.addEventListener('visibilitychange',()=>{if(document.hidden)backup()});
</script>
</body>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کلینیک دکتر کوچک‌زاده</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@font-face{font-family:Vazir;src:url(vazir.woff2) format('woff2')}
*{box-sizing:border-box}body{font-family:Vazir,system-ui;background:#151024;color:#fff;margin:0;padding-bottom:90px}
header{display:flex;align-items:center;gap:10px;padding:12px;background:#221744;position:sticky;top:0;z-index:5}
header img{width:48px;height:48px;border-radius:12px;background:#fff}
header h1{font-size:16px;margin:0}header small{font-size:11px;opacity:.9}
#dbBadge{display:inline-block;margin-top:4px;font-size:11px;background:#333;padding:3px 8px;border-radius:20px}
nav{display:flex;gap:8px;padding:10px;position:sticky;top:72px;background:#151024;z-index:4}
nav button{flex:1;padding:10px;border:0;border-radius:12px;background:#2c2350;color:#fff;font-family:inherit}
nav button.on{background:#7c5cff}
main{padding:12px}section.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;margin-bottom:12px}
input,select,textarea{width:100%;padding:9px;border-radius:10px;border:1px solid #444;background:#1e1838;color:#fff;font-family:inherit;margin:4px 0}
button.b{padding:9px 12px;border:0;border-radius:10px;background:#7c5cff;color:#fff;font-family:inherit;margin:2px}
button.g{background:#2e9e62}button.r{background:#c14a4a}button.o{background:#b67a00}button.d{background:#444}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.appt{background:#231c4a;border-radius:12px;padding:10px;margin:8px 0;border-right:4px solid #7c5cff}
.appt.surg{border-color:#ff9a3d}.appt.cancel{opacity:.55;border-color:#666}
.appt .meta{font-size:12px;opacity:.9}.fee{color:#7CFFB2;font-weight:bold}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin:8px 0}
.slot{padding:8px;text-align:center;border-radius:10px;font-size:12px;border:1px solid #555;background:#2a2452}
.slot.free{background:#1d5c38;cursor:pointer}.slot.full{background:#5c1d1d;opacity:.7}
#fab{position:fixed;bottom:18px;left:18px;width:60px;height:60px;border-radius:50%;border:0;background:#7c5cff;color:#fff;font-size:30px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#ov .box{background:#211a44;border-radius:16px;padding:14px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
#toast{position:fixed;bottom:90px;right:12px;left:12px;background:#000;border:1px solid #7c5cff;border-radius:12px;padding:10px;display:none;z-index:50;font-size:13px}
#pp{position:absolute;left:-10000px;top:0;width:794px;background:#fff;color:#000;padding:20px}
#shareBox{background:#1d2b23;border:1px solid #2e9e62;border-radius:12px;padding:10px;margin-top:10px}
#shareTxt{white-space:pre-wrap;font-size:13px;background:#0f1512;padding:8px;border-radius:8px}
table.pdf{width:100%;border-collapse:collapse;font-size:12px}table.pdf th,table.pdf td{border:1px solid #333;padding:5px;text-align:center}
</style>
</head>
<body>
<header>
<img id="logoTop" src="icon.png" onerror="this.style.display='none'">
<div><h1 id="clinicTitle">کلینیک دامپزشکی دکتر کوچک‌زاده</h1><span id="dbBadge">… آماده‌سازی …</span></div>
</header>
<nav><button data-t="tl" class="on" onclick="setTab('tl')">تایم‌لاین</button><button data-t="fl" onclick="setTab('fl')">پرونده‌ها</button><button data-t="st" onclick="setTab('st')">تنظیمات</button></nav>
<main>
<div id="tl">
<section class="card"><div class="row"><button class="b d" onclick="moveDay(-1)">◀ روز قبل</button><input type="date" id="dayPick"><button class="b d" onclick="moveDay(1)">روز بعد ▶</button></div>
<div class="row"><button class="b" onclick="goToday()">امروز</button><button class="b g" onclick="pdfDay()">PDF روزانه + جمع</button></div>
<div id="shareBox" hidden><div id="shareTxt"></div><div class="row"><button class="b g" onclick="shareLastFile()">ارسال PDF</button><button class="b" onclick="shareWA()">واتساپ</button><button class="b" onclick="shareTG()">تلگرام</button><button class="b d" onclick="shareSysText()">اشتراک متن</button></div><div style="font-size:11px;opacity:.8">متن جمع روز برای واتساپ/تلگرام است. دکمه ارسال PDF فایل را با Share گوشی می‌فرستد.</div></div>
<h3 id="dayTitle"></h3><div id="slotGrid" class="slots"></div><div id="apptList"></div></section>
<section class="card"><h3>یادآور واکسن (۷ روز آینده)</h3><div id="vacList"></div></section>
</div>
<div id="fl" hidden>
<section class="card"><input id="q" placeholder="جستجو: نام، تلفن، حیوان…" oninput="renderSearch()"><div id="res"></div></section>
<section class="card"><div id="fileView">یک پرونده را انتخاب کنید</div></section>
</div>
<div id="st" hidden>
<section class="card"><h3>تنظیمات</h3>
<label>نام کلینیک</label><input id="s_clinic">
<div class="row"><div><label>پزشک معاینه</label><input id="s_docExam"></div><div><label>پزشک جراحی</label><input id="s_docSurg"></div></div>
<div class="row"><div><label>مدت معاینه (دقیقه)</label><input id="s_dExam" inputmode="numeric"></div><div><label>مدت پیش‌فرض جراحی</label><input id="s_dSurg" inputmode="numeric"></div></div>
<label>متن پیامک نوبت</label><textarea id="s_tBook"></textarea>
<label>متن پیامک واکسن</label><textarea id="s_tVac"></textarea>
<label>متن پیامک انجام شد</label><textarea id="s_tDone"></textarea>
<button class="b g" onclick="saveS()">ذخیره تنظیمات</button></section>
<section class="card"><h3>بکاپ</h3><div class="row"><button class="b" onclick="backup()">گرفتن بکاپ</button><label class="b d" style="text-align:center;padding:9px">بازیابی<input type="file" id="imp" accept=".json" hidden onchange="restoreFile(this.files[0])"></label></div><div id="stInfo" style="font-size:12px"></div></section>
</div>
</main>
<button id="fab" onclick="book()">+</button>
<div id="ov"><div class="box"><div class="row"><b style="flex:1">فرم</b><button class="b r" onclick="closeOv()">✕</button></div><div id="ovBox"></div></div></div>
<div id="toast"></div>
<div id="pp"></div>
<script>
function $(id){return document.getElementById(id)}
function E(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function FA(s){return String(s==null?'':s).replace(/[0-9]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})}
function EN(s){return String(s==null?'':s).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})}
function toast(m){console.log(m);var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},3500)}
window.onerror=function(m){toast(String(m).slice(0,220))};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function mins(hm){var p=String(hm||'0:0').split(':');return (+p[0])*60+(+p[1])}
function hm(m){m=((m%1440)+1440)%1440;var h=Math.floor(m/60),mm=m%60;return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm)}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var TODAY=iso(new Date());
function nowT(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function nowStamp(){try{var d=new Date();var dfa=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d);var t=new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit'}).format(d);return dfa+' ساعت '+t}catch(e){return TODAY+' '+nowT()}}
function pd(g){try{var d=new Date(g+'T12:00:00');return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric'}).format(d)}catch(e){return g}}
function wd(g){try{return new Intl.DateTimeFormat('fa-IR',{weekday:'long'}).format(new Date(g+'T12:00:00'))}catch(e){return ''}}
function addD(g,n){var d=new Date(g+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
var TY=['سگ','گربه','پرنده','دیگر'];
var WOPEN=600,WCLOSE=1320,STEP=20;
var DEF={clinic:'کلینیک دامپزشکی دکتر کوچک‌زاده',docExam:'دکتر کوچک‌زاده',docSurg:'دکتر کوچک‌زاده',dExam:'20',dSurg:'120',tBook:'سلام {name} عزیز، نوبت {kind} شما در تاریخ {date} ساعت {time} در {clinic} ثبت شد.',tVac:'یادآور واکسن {vac} برای {animal} ({name}) تاریخ {due} — {clinic}',tDone:'خدمت {name} عزیز انجام شد — {clinic}'};
function ST(){var s=(MEM&&MEM.settings)||{};var o={};for(var k in DEF)o[k]=s[k]!=null?s[k]:DEF[k];return o}
function fill(t,d){return String(t||'').replace('{name}',d.name||'').replace('{animal}',d.animal||'').replace('{vac}',d.vac||'').replace('{date}',d.date||'').replace('{due}',d.due||'').replace('{time}',d.time||'').replace('{kind}',d.kind||'').replace('{fee}',d.fee||'').replace('{clinic}',ST().clinic)}
var MODE='mem',DB=null,MEM=null;
var LAST_PDF_BASE64='',LAST_PDF_NAME='',LAST_TEXT='';
function memLoad(){try{MEM=JSON.parse(localStorage.getItem('clinic_mem_v1')||'null')||{owners:[],animals:[],vacc:[],hist:[],appts:[],settings:Object.assign({},DEF)}}catch(e){MEM={owners:[],animals:[],vacc:[],hist:[],appts:[],settings:Object.assign({},DEF)}}if(!MEM.settings)MEM.settings=Object.assign({},DEF)}
function memSave(){try{localStorage.setItem('clinic_mem_v1',JSON.stringify(MEM));return true}catch(e){toast('خطای حافظه: '+e.message);return false}}
function setBadge(t,ok){var b=$('dbBadge');b.textContent=t;b.style.background=ok?'#1b8a4b':'#a86a00'}
async function initDb(){memLoad();setBadge('… آماده‌سازی …');try{$('dayPick').value=TODAY}catch(e){}renderAll();try{var CS=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.CapacitorSQLite;if(!CS)throw new Error('حالت وب');try{await CS.checkConnectionsConsistency({database:'clinic'})}catch(e){}try{await CS.createConnection({database:'clinic',version:1,encrypted:false,mode:'no-encryption'})}catch(e){}await CS.open({database:'clinic'});var stmts='CREATE TABLE IF NOT EXISTS owners(phone TEXT PRIMARY KEY,name TEXT,gender TEXT,note TEXT,notified TEXT);CREATE TABLE IF NOT EXISTS animals(id TEXT PRIMARY KEY,phone TEXT,type TEXT,name TEXT,breed TEXT,sex TEXT,birth TEXT,weight TEXT,neu TEXT,allergy TEXT,note TEXT);CREATE TABLE IF NOT EXISTS vacc(id TEXT PRIMARY KEY,aid TEXT,name TEXT,date TEXT,due TEXT,state TEXT,fee TEXT,doneDate TEXT);CREATE TABLE IF NOT EXISTS hist(id INTEGER PRIMARY KEY AUTOINCREMENT,aid TEXT,date TEXT,type TEXT,diag TEXT,drug TEXT,note TEXT);CREATE TABLE IF NOT EXISTS appts(id TEXT PRIMARY KEY,phone TEXT,aid TEXT,kind TEXT,date TEXT,time TEXT,st TEXT,fee TEXT,dur INTEGER);CREATE TABLE IF NOT EXISTS settings(k TEXT PRIMARY KEY,v TEXT);';await CS.execute({database:'clinic',statements:stmts});var migs=['ALTER TABLE appts ADD COLUMN fee TEXT','ALTER TABLE appts ADD COLUMN dur INTEGER','ALTER TABLE vacc ADD COLUMN fee TEXT','ALTER TABLE vacc ADD COLUMN doneDate TEXT','ALTER TABLE owners ADD COLUMN notified TEXT'];for(var i=0;i<migs.length;i++){try{await CS.execute({database:'clinic',statements:migs[i]+';'})}catch(e){}}MODE='sqlite';DB=CS;await pullFromSqlite();await pushIfEmpty();setBadge('SQLite متصل ✓',true)}catch(e){MODE='mem';setBadge('حافظه داخلی ✓',false)}renderAll()}
async function pullFromSqlite(){try{async function T(n){var r=await DB.query({database:'clinic',statement:'SELECT * FROM '+n,values:[]});return r.values||[]}var o=await T('owners'),a=await T('animals'),v=await T('vacc'),h=await T('hist'),ap=await T('appts');if(o.length||a.length||ap.length||v.length){MEM.owners=o;MEM.animals=a;MEM.vacc=v;MEM.hist=h;MEM.appts=ap;try{var s=await DB.query({database:'clinic',statement:'SELECT * FROM settings',values:[]});(s.values||[]).forEach(function(r){MEM.settings[r.k]=r.v})}catch(e){}memSave()}}catch(e){}}
async function pushIfEmpty(){try{var r=await DB.query({database:'clinic',statement:'SELECT COUNT(*) as c FROM owners',values:[]});var c=r.values&&r.values[0]&&r.values[0].c;if((!c||c==0)&&(MEM.owners.length||MEM.appts.length)){for(var i=0;i<MEM.owners.length;i++)await mirrorIns('owners',MEM.owners[i]);for(var j=0;j<MEM.animals.length;j++)await mirrorIns('animals',MEM.animals[j]);for(var k=0;k<MEM.vacc.length;k++)await mirrorIns('vacc',MEM.vacc[k]);for(var m=0;m<MEM.appts.length;m++)await mirrorIns('appts',MEM.appts[m]);for(var key in MEM.settings){try{await DB.run({database:'clinic',statement:'INSERT OR REPLACE INTO settings(k,v) VALUES(?,?)',values:[key,String(MEM.settings[key])]})}catch(e){}}}}catch(e){}}
async function mirrorIns(tab,obj){if(MODE!=='sqlite'||!DB)return;try{var ks=Object.keys(obj);await DB.run({database:'clinic',statement:'INSERT OR REPLACE INTO '+tab+' ('+ks.join(',')+') VALUES ('+ks.map(function(){return '?'}).join(',')+')',values:ks.map(function(k){return obj[k]==null?null:obj[k]})})}catch(e){}}
async function mirrorDel(tab,col,val){if(MODE!=='sqlite'||!DB)return;try{await DB.run({database:'clinic',statement:'DELETE FROM '+tab+' WHERE '+col+'=?',values:[val]})}catch(e){}}
async function mirrorSet(tab,col,val,where,wval){if(MODE!=='sqlite'||!DB)return;try{await DB.run({database:'clinic',statement:'UPDATE '+tab+' SET '+col+'=? WHERE '+where+'=?',values:[val,wval]})}catch(e){}}
function setTab(t){['tl','fl','st'].forEach(function(x){$(x).hidden=(x!==t)});document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)})}
function moveDay(n){var d=$('dayPick').value||TODAY;$('dayPick').value=addD(d,n);renderDay()}
function goToday(){$('dayPick').value=TODAY;renderDay()}
function renderAll(){try{$('clinicTitle').textContent=ST().clinic||DEF.clinic}catch(e){}renderDay();renderVac();renderSearch();renderSettings()}
function occAt(day,t,dur){dur=dur||20;var s=mins(t),e=s+dur;for(var i=0;i<MEM.appts.length;i++){var a=MEM.appts[i];if(a.date!==day||a.st==='cancel')continue;var os=mins(a.time),od=a.dur||(a.kind==='surgery'?+ST().dSurg||120:+ST().dExam||20),oe=os+od;if(s<oe&&os<e)return a}return null}
function renderDay(){var day=$('dayPick').value||TODAY;$('dayTitle').textContent=wd(day)+' — '+pd(day)+' ('+FA(day)+')';var g='';for(var t=WOPEN;t<WCLOSE;t+=STEP){var h=hm(t),o=occAt(day,h,STEP);if(o&&o.kind==='exam')g+='<div class="slot full">'+FA(h)+'<br>پر</div>';else if(o)g+='<div class="slot full">'+FA(h)+'<br>جراحی</div>';else g+='<div class="slot free" onclick="book(null,\''+day+'\',\''+h+'\')">'+FA(h)+'<br>خالی</div>'}$('slotGrid').innerHTML=g+'<div style="grid-column:1/-1;font-size:11px;opacity:.8">معاینه ۱۰ تا ۲۲ هر ۲۰ دقیقه — جراحی با دکمه +</div>';var list=MEM.appts.filter(function(a){return a.date===day}).sort(function(a,b){return mins(a.time)-mins(b.time)});if(!list.length){$('apptList').innerHTML='<p style="opacity:.7">نوبتی ثبت نشده</p>';return}var s='';list.forEach(function(a){var an=MEM.animals.find(function(x){return x.id===a.aid})||{};var ow=MEM.owners.find(function(x){return x.phone===a.phone})||{};var st=a.st==='arr'?'✅ آمده':a.st==='cancel'?'❌ لغو شده':'⏳ منتظر';s+='<div class="appt '+(a.kind==='surgery'?'surg':'')+(a.st==='cancel'?' cancel':'')+'"><b>'+FA(a.time)+'</b> — '+E(an.name||'-')+' ('+(a.kind==='surgery'?'جراحی':'معاینه')+')<div class="meta">'+E(ow.name||'')+' — '+FA(a.phone||'')+' — '+st+' — وجه: <span class="fee">'+FA(a.fee||'۰')+' تومان</span>'+(a.dur?' — مدت '+FA(a.dur)+' دقیقه':'')+'</div><div class="row"><button class="b g" onclick="apptArr(\''+a.id+'\')">آمد</button><button class="b o" onclick="apptFee(\''+a.id+'\')">وجه دریافتی</button><button class="b d" onclick="apptCanc(\''+a.id+'\')">لغو</button><button class="b r" onclick="apptDel(\''+a.id+'\')">حذف</button></div></div>')});$('apptList').innerHTML=s}
function renderVac(){var lim=addD(TODAY,7);var list=MEM.vacc.filter(function(v){return v.state!=='done'&&v.due<=lim}).sort(function(a,b){return (a.due<b.due?-1:1)});if(!list.length){$('vacList').innerHTML='<p style="opacity:.7">یادآوری نیست</p>';return}var s='';list.forEach(function(v){var an=MEM.animals.find(function(x){return x.id===v.aid})||{};var ow=MEM.owners.find(function(x){return x.phone===an.phone})||{};s+='<div class="appt"><b>'+E(v.name)+'</b> — '+E(an.name||'')+'<div class="meta">موعد: '+FA(pd(v.due))+' — '+E(ow.name||'')+' — '+FA(an.phone||ow.phone||'')+' — وضعیت: '+(v.state==='sent'?'پیامک شد':'در انتظار')+' — وجه: <span class="fee">'+FA(v.fee||'۰')+' تومان</span></div><div class="row"><button class="b o" onclick="vacFee(\''+v.id+'\')">هزینه</button><button class="b" onclick="vacSend(\''+v.id+'\')">پیامک</button><button class="b g" onclick="vacEnd(\''+v.id+'\')">انجام شد</button><button class="b r" onclick="vacDel(\''+v.id+'\')">حذف</button></div></div>')});$('vacList').innerHTML=s}
async function ensureSmsPerm(){try{var P=window.cordova&&window.cordova.plugins&&window.cordova.plugins.permissions;if(P){var pr=function(n){return new Promise(function(res){P.checkPermission(n,function(s){if(s.hasPermission)res(true);else P.requestPermission(n,function(s2){res(s2.hasPermission)},function(){res(false)})},function(){res(false)})})};await pr(P.SEND_SMS)}}catch(e){}}
async function sendSms(phone,msg){phone=EN(String(phone||'').replace(/\D/g,''));if(!phone){toast('شماره نامعتبر است');return false}await ensureSmsPerm();try{if(window.sms&&window.sms.send){await new Promise(function(res,rej){window.sms.send(phone,msg,{android:{intent:''}},function(){res()},function(e){rej(new Error(e))})});toast('پیامک ارسال شد');return true}}catch(e){toast('خطای SMS: '+e.message);return false}try{window.open('sms:'+phone+'?body='+encodeURIComponent(msg),'_system');return true}catch(e){toast('ارسال خودکار نشد');return false}}
function openOv(h){$('ovBox').innerHTML=h;$('ov').style.display='flex'}
function closeOv(){$('ov').style.display='none'}
function ownerOpts(sel){return MEM.owners.map(function(o){return '<option value="'+E(o.phone)+'"'+(o.phone===sel?' selected':'')+'>'+E(o.name||o.phone)+' — '+FA(o.phone)+'</option>'}).join('')}
function animalOpts(phone,sel){return MEM.animals.filter(function(a){return !phone||a.phone===phone}).map(function(a){return '<option value="'+a.id+'"'+(a.id===sel?' selected':'')+'>'+E(a.name)+' ('+E(a.type)+')</option>'}).join('')}
function book(ex,presetDate,presetTime){var day=presetDate||($('dayPick').value||TODAY);var h='<label>تلفن صاحب</label><input id="b_phone" inputmode="numeric" placeholder="09..."><label>صاحب (انتخاب یا جدید)</label><select id="b_owner" onchange="document.getElementById(\'b_phone\').value=this.value"><option value="">— جدید —</option>'+ownerOpts()+'</select><label>نام صاحب (اگر جدید)</label><input id="b_oname"><label>حیوان</label><select id="b_aid"></select><label>نام حیوان جدید (اگر حیوان جدید)</label><input id="b_aname"><div class="row"><div><label>نوع</label><select id="b_kind" onchange="chgKind()"><option value="exam">معاینه (۲۰ دقیقه‌ای)</option><option value="surgery">جراحی (مدت متغیر)</option></select></div><div><label>تاریخ</label><input type="date" id="b_date" value="'+day+'"></div></div><div id="slotPick" class="slots"></div><div class="row"><div><label>ساعت</label><input id="b_time" value="'+(presetTime||'10:00')+'"></div><div id="durWrap" hidden><label>مدت جراحی (دقیقه)</label><input id="b_dur" inputmode="numeric" value="120"></div></div><label>وجه دریافتی (تومان)</label><input id="b_fee" inputmode="numeric"><button class="b g" onclick="bookSave()">ذخیره نوبت</button>';openOv(h);refreshAid();chgKind();drawSlotPick()}
function refreshAid(){var ph=$('b_phone').value||$('b_owner').value;var aids=MEM.animals.filter(function(a){return a.phone===ph});$('b_aid').innerHTML=aids.length?animalOpts(ph):'<option value="">— حیوان جدید —</option>'}
function chgKind(){var k=$('b_kind').value;$('durWrap').hidden=(k!=='surgery');drawSlotPick()}
function drawSlotPick(){var el=$('slotPick');if(!el)return;if($('b_kind').value!=='exam'){el.innerHTML='<div style="grid-column:1/-1;font-size:12px">جراحی: ساعت شروع + مدت را دستی وارد کنید</div>';return}var day=$('b_date').value||TODAY;var s='';for(var t=WOPEN;t<WCLOSE;t+=STEP){var h=hm(t),o=occAt(day,h,STEP);s+=o?'<div class="slot full">'+FA(h)+'</div>':'<div class="slot free" onclick="pickSlot(\''+h+'\')">'+FA(h)+'</div>'}el.innerHTML=s}
function pickSlot(h){$('b_time').value=h;toast('ساعت '+FA(h)+' انتخاب شد')}
async function bookSave(){try{var phone=EN(($('b_phone').value||$('b_owner').value||'').replace(/\D/g,''));if(phone.length<10){toast('تلفن را کامل وارد کنید');return}var oname=$('b_oname').value.trim();var ow=MEM.owners.find(function(o){return o.phone===phone});if(!ow){ow={phone:phone,name:oname||phone,gender:'',note:'',notified:''};MEM.owners.push(ow);await mirrorIns('owners',ow)}var aid=$('b_aid').value;var an=MEM.animals.find(function(a){return a.id===aid});if(!an){var aname=$('b_aname').value.trim()||'بدون‌نام';an={id:uid(),phone:phone,type:'سگ',name:aname,breed:'',sex:'',birth:'',weight:'',neu:'',allergy:'',note:''};MEM.animals.push(an);await mirrorIns('animals',an)}var kind=$('b_kind').value,date=$('b_date').value||TODAY,time=$('b_time').value||'10:00',fee=EN($('b_fee').value||'').replace(/\D/g,'');var dur=kind==='surgery'?(+EN($('b_dur').value)||120):(+ST().dExam||20);var s=mins(time),e=s+dur;for(var i=0;i<MEM.appts.length;i++){var a=MEM.appts[i];if(a.date!==date||a.st==='cancel')continue;var os=mins(a.time),od=a.dur||(a.kind==='surgery'?+ST().dSurg||120:+ST().dExam||20);if(s<os+od&&os<e){toast('تداخل با نوبت '+FA(a.time));return}}var ap={id:uid(),phone:phone,aid:an.id,kind:kind,date:date,time:time,st:'wait',fee:fee,dur:dur};MEM.appts.push(ap);await mirrorIns('appts',ap);if(!memSave())return;closeOv();renderDay();toast('نوبت ذخیره شد ✓');try{var msg=fill(ST().tBook,{name:ow.name,animal:an.name,kind:kind==='surgery'?'جراحی':'معاینه',date:pd(date),time:FA(time)});sendSms(phone,msg)}catch(e){}}catch(e){toast('خطا: '+(e.message||e))}}
async function apptFee(id){var a=MEM.appts.find(function(x){return x.id===id});if(!a)return;var v=prompt('وجه دریافتی (تومان):',a.fee||'');if(v==null)return;v=EN(v).replace(/\D/g,'');a.fee=v;await mirrorSet('appts','fee',v,'id',id);memSave();renderDay();toast('وجه ثبت شد')}
async function apptArr(id){var a=MEM.appts.find(function(x){return x.id===id});if(!a)return;a.st='arr';await mirrorSet('appts','st','arr','id',id);memSave();renderDay()}
async function apptCanc(id){var a=MEM.appts.find(function(x){return x.id===id});if(!a)return;a.st='cancel';await mirrorSet('appts','st','cancel','id',id);memSave();renderDay()}
async function apptDel(id){if(!confirm('حذف شود؟'))return;MEM.appts=MEM.appts.filter(function(x){return x.id!==id});await mirrorDel('appts','id',id);memSave();renderDay()}
async function vacFee(id){var v=MEM.vacc.find(function(x){return x.id===id});if(!v)return;var p=prompt('هزینه واکسن '+v.name+' (تومان):',v.fee||'');if(p==null)return;p=EN(p).replace(/\D/g,'');v.fee=p;await mirrorSet('vacc','fee',p,'id',id);memSave();renderVac();toast('هزینه ثبت شد')}
async function vacSend(id){var v=MEM.vacc.find(function(x){return x.id===id});if(!v)return;var an=MEM.animals.find(function(a){return a.id===v.aid})||{};var ow=MEM.owners.find(function(o){return o.phone===an.phone})||{};var msg=fill(ST().tVac,{name:ow.name,animal:an.name,vac:v.name,due:pd(v.due)});var ok=await sendSms(an.phone||ow.phone,msg);if(ok){v.state='sent';await mirrorSet('vacc','state','sent','id',id);memSave();renderVac()}}
async function vacEnd(id){var v=MEM.vacc.find(function(x){return x.id===id});if(!v)return;v.state='done';v.doneDate=TODAY;await mirrorSet('vacc','state','done','id',id);await mirrorSet('vacc','doneDate',TODAY,'id',id);var h={aid:v.aid,date:TODAY,type:'واکسن',diag:v.name,drug:'',note:'انجام شد'};MEM.hist.push(h);await mirrorIns('hist',Object.assign({id:Date.now()},h));memSave();renderVac();if(curPhone)openFile(curPhone,curAid,true);toast('انجام شد و از تایم‌لاین خارج شد ✓')}
async function vacDel(id){if(!confirm('حذف واکسن؟'))return;MEM.vacc=MEM.vacc.filter(function(x){return x.id!==id});await mirrorDel('vacc','id',id);memSave();renderVac();if(curPhone)openFile(curPhone,curAid,true)}
function renderSearch(){var qv=$('q').value||'';var q=EN(qv.trim());var box=$('res');if(!q){box.innerHTML='';return}var h='';MEM.owners.filter(function(o){return o.phone.includes(q)||(o.name||'').includes(qv)}).slice(0,20).forEach(function(o){h+='<div class="appt" onclick="openFile(\''+o.phone+'\')"><b>'+E(o.name)+'</b> — '+FA(o.phone)+'</div>'});MEM.animals.filter(function(a){return (a.name||'').includes(qv)}).slice(0,20).forEach(function(a){h+='<div class="appt" onclick="openFile(\''+a.phone+'\',\''+a.id+'\')">'+E(a.name)+' ('+E(a.type)+') — '+FA(a.phone)+'</div>'});box.innerHTML=h||'یافت نشد'}
var curPhone=null,curAid=null;
function openFile(phone,aid,keep){curPhone=phone;curAid=aid||curAid;var ow=MEM.owners.find(function(o){return o.phone===phone})||{phone:phone,name:'',gender:'',note:''};var ans=MEM.animals.filter(function(a){return a.phone===phone});if(!curAid&&ans[0])curAid=ans[0].id;var an=ans.find(function(a){return a.id===curAid})||ans[0]||null;var h='<h3>پرونده: '+E(ow.name||phone)+'</h3><div class="meta">'+FA(phone)+'</div><label>نام صاحب</label><input id="f_oname" value="'+E(ow.name||'')+'"><label>یادداشت صاحب</label><input id="f_onote" value="'+E(ow.note||'')+'"><button class="b g" onclick="saveF()">ذخیره صاحب</button> <button class="b" onclick="pdfFile()">PDF پرونده</button><hr><b>حیوانات:</b> ';ans.forEach(function(a){h+='<button class="b '+(an&&a.id===an.id?'':'d')+'" onclick="openFile(\''+phone+'\',\''+a.id+'\')">'+E(a.name)+'</button> '});h+='<button class="b" onclick="newAnimal()">+ حیوان جدید</button>';if(an){h+='<hr><label>نام حیوان</label><input id="f_aname" value="'+E(an.name||'')+'"><div class="row"><div><label>نوع</label><select id="f_atype">'+TY.map(function(t){return '<option'+(an.type===t?' selected':'')+'>'+t+'</option>'}).join('')+'</select></div><div><label>نژاد</label><input id="f_breed" value="'+E(an.breed||'')+'"></div></div><button class="b g" onclick="saveA()">ذخیره حیوان</button><hr><b>واکسن‌ها:</b><div>'+MEM.vacc.filter(function(v){return v.aid===an.id}).map(function(v){return '<div class="appt">• '+E(v.name)+' — موعد '+FA(pd(v.due))+' — '+(v.state==='done'?'✅ انجام‌شده':'⏳ '+(v.state==='sent'?'پیامک شد':'منتظر'))+(v.state!=='done'?' <button class="b g" onclick="vacEnd(\''+v.id+'\')">انجام شد</button>':'')+'</div>'}).join('')+'</div><button class="b" onclick="addV()">+ واکسن</button><hr><b>سوابق درمانی:</b><div>'+MEM.hist.filter(function(x){return x.aid===an.id}).slice().reverse().map(function(x){return '<div class="appt">• '+FA(pd(x.date))+' — '+E(x.type)+' — '+E(x.diag)+' — '+E(x.note||'')+'</div>'}).join('')+'</div><button class="b" onclick="addH()">+ سابقه</button>'}setTab('fl');$('fileView').innerHTML=h;if(!keep)window.scrollTo(0,document.body.scrollHeight)}
async function saveF(){var ow=MEM.owners.find(function(o){return o.phone===curPhone});if(!ow){ow={phone:curPhone,name:'',note:'',gender:'',notified:''};MEM.owners.push(ow)}ow.name=$('f_oname').value.trim();ow.note=$('f_onote').value;await mirrorIns('owners',ow);memSave();renderSearch();toast('ذخیره شد ✓')}
async function saveA(){var an=MEM.animals.find(function(a){return a.id===curAid});if(!an)return;an.name=$('f_aname').value;an.type=$('f_atype').value;an.breed=$('f_breed').value;await mirrorIns('animals',an);memSave();openFile(curPhone,curAid,true);toast('ذخیره شد ✓')}
async function newAnimal(){var n=prompt('نام حیوان:');if(!n)return;var an={id:uid(),phone:curPhone,type:'سگ',name:n,breed:'',sex:'',birth:'',weight:'',neu:'',allergy:'',note:''};MEM.animals.push(an);await mirrorIns('animals',an);memSave();openFile(curPhone,an.id,true)}
async function addV(){if(!curAid){toast('اول حیوان را انتخاب کنید');return}var n=prompt('نام واکسن:');if(!n)return;var due=prompt('موعد (میلادی YYYY-MM-DD، خالی = امروز + ۳۰ روز):',addD(TODAY,30));due=(due||'').trim()||addD(TODAY,30);var v={id:uid(),aid:curAid,name:n,date:TODAY,due:due,state:'wait',fee:'',doneDate:''};MEM.vacc.push(v);await mirrorIns('vacc',v);memSave();openFile(curPhone,curAid,true);renderVac();toast('واکسن ثبت شد')}
async function addH(){if(!curAid)return;var d=prompt('شرح (تشخیص/واکسن/درمان):');if(!d)return;var h={aid:curAid,date:TODAY,type:'ویزیت',diag:d,drug:'',note:''};MEM.hist.push(h);await mirrorIns('hist',Object.assign({id:Date.now()},h));memSave();openFile(curPhone,curAid,true)}
function renderSettings(){var s=ST();$('s_clinic').value=s.clinic;$('s_docExam').value=s.docExam;$('s_docSurg').value=s.docSurg;$('s_dExam').value=s.dExam;$('s_dSurg').value=s.dSurg;$('s_tBook').value=s.tBook;$('s_tVac').value=s.tVac;$('s_tDone').value=s.tDone;$('stInfo').textContent='حالت: '+(MODE==='sqlite'?'SQLite':'حافظه داخلی')+' — نوبت: '+FA(MEM.appts.length)+' — پرونده: '+FA(MEM.owners.length)}
async function saveS(){['clinic','docExam','docSurg','dExam','dSurg','tBook','tVac','tDone'].forEach(function(k){MEM.settings[k]=$('s_'+k).value});memSave();if(MODE==='sqlite'&&DB){for(var k in MEM.settings){try{await DB.run({database:'clinic',statement:'INSERT OR REPLACE INTO settings(k,v) VALUES(?,?)',values:[k,String(MEM.settings[k])]})}catch(e){}}}renderAll();toast('تنظیمات ذخیره شد')}
async function backup(){try{var data=JSON.stringify(MEM);var fname='KoochakzadehClinic/backup-'+TODAY+'.json';var FS=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Filesystem;if(FS){try{await FS.writeFile({path:fname,data:data,directory:'DOCUMENTS',recursive:true});toast('بکاپ در Documents ذخیره شد');return}catch(e){try{await FS.writeFile({path:fname,data:btoa(unescape(encodeURIComponent(data))),directory:'DOCUMENTS',recursive:true});toast('بکاپ ذخیره شد');return}catch(e2){toast('خطای بکاپ: '+e2.message)}}}var blob=new Blob([data],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-'+TODAY+'.json';a.click();toast('فایل بکاپ دانلود شد')}catch(e){toast('خطای بکاپ: '+e.message)}}
async function restoreFile(f){if(!f)return;var r=new FileReader();r.onload=async function(){try{var j=JSON.parse(r.result);if(!j.owners)throw new Error('فایل معتبر نیست');MEM=j;if(!MEM.settings)MEM.settings=Object.assign({},DEF);memSave();if(MODE==='sqlite'&&DB){for(var t of ['appts','vacc','hist','animals','owners']){try{await DB.run({database:'clinic',statement:'DELETE FROM '+t,values:[]})}catch(e){}}for(var o of MEM.owners)await mirrorIns('owners',o);for(var a of MEM.animals)await mirrorIns('animals',a);for(var v of MEM.vacc)await mirrorIns('vacc',v);for(var ap of MEM.appts)await mirrorIns('appts',ap)}renderAll();toast('بازیابی انجام شد ✓')}catch(e){toast('فایل خراب: '+e.message)}};r.readAsText(f)}
function hdr(t,sub){return '<div style="text-align:center"><b style="font-size:18px">🐾 '+E(ST().clinic)+'</b><div>'+E(t)+'</div><div style="font-size:11px">'+E(sub||'')+'</div><div style="font-size:11px">صدور: '+nowStamp()+'</div><hr></div>'}
function ftr(){return '<hr><div style="font-size:10px;text-align:center">صادرشده در '+nowStamp()+' — '+E(ST().clinic)+'</div>'}
function b64ToBlob(b64,type){try{var bin=atob(b64);var arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:type||'application/pdf'})}catch(e){return null}}
async function pdfOut(html,fname){$('pp').innerHTML=html;try{if(window.html2canvas&&window.jspdf){var cv=await html2canvas($('pp'),{scale:2});var img=cv.toDataURL('image/png');var pdf=new window.jspdf.jsPDF('p','mm','a4');var w=210,ph=cv.height*w/cv.width,hh=0;while(hh<ph){if(hh>0)pdf.addPage();pdf.addImage(img,'PNG',0,-hh,w,ph);hh+=297}var out=pdf.output('datauristring').split(',')[1];var FS=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Filesystem;if(FS){try{await FS.writeFile({path:'KoochakzadehClinic/PDF/'+fname+'.pdf',data:out,directory:'DOCUMENTS',recursive:true});toast('PDF در Documents ذخیره شد')}catch(e){toast('خطای ذخیره PDF: '+e.message)}}else{var a=document.createElement('a');a.href='data:application/pdf;base64,'+out;a.download=fname+'.pdf';a.click()}return out}}catch(e){}try{window.print()}catch(e){}return ''}
async function pdfDay(){var day=$('dayPick').value||TODAY;var list=MEM.appts.filter(function(a){return a.date===day}).sort(function(a,b){return mins(a.time)-mins(b.time)});var totA=0;var rows=list.map(function(a){totA+=+((a.fee||'').replace(/\D/g,'')||0);var an=MEM.animals.find(function(x){return x.id===a.aid})||{};return '<tr><td>'+FA(a.time)+'</td><td>'+E(an.name||'')+'</td><td>'+FA(a.phone||'')+'</td><td>'+(a.kind==='surgery'?'جراحی':'معاینه')+'</td><td>'+(a.st==='arr'?'آمده':a.st==='cancel'?'لغو':'منتظر')+'</td><td>'+FA(a.fee||'۰')+'</td></tr>'}).join('');var vdone=MEM.vacc.filter(function(v){return v.state==='done'&&(v.doneDate===day||(!v.doneDate&&v.date===day))});var totV=0;var rowsV=vdone.map(function(v){totV+=+((v.fee||'').replace(/\D/g,'')||0);var an=MEM.animals.find(function(x){return x.id===v.aid})||{};return '<tr><td>'+E(v.name)+'</td><td>'+E(an.name||'')+'</td><td>'+FA(v.fee||'۰')+'</td></tr>'}).join('');var tot=totA+totV;var txt='گزارش روزانه '+pd(day)+' ('+day+')\nتعداد نوبت: '+list.length+'\nتعداد واکسن انجام‌شده: '+vdone.length+'\nجمع نوبت‌ها: '+totA+' تومان\nجمع واکسن‌ها: '+totV+' تومان\nجمع کل روز: '+tot+' تومان\n'+ST().clinic;var html=hdr('گزارش روزانه — '+pd(day)+' ('+day+')','')+'<table class="pdf"><tr><th>ساعت</th><th>نام</th><th>تلفن</th><th>نوع</th><th>وضعیت</th><th>وجه (تومان)</th></tr>'+rows+'</table>'+(vdone.length?'<p><b>واکسن‌های انجام‌شده امروز:</b></p><table class="pdf"><tr><th>واکسن</th><th>حیوان</th><th>وجه (تومان)</th></tr>'+rowsV+'</table>':'')+'<p><b>جمع کل روز: '+FA(String(tot))+' تومان</b> (نوبت '+FA(String(totA))+' + واکسن '+FA(String(totV))+')</p>'+ftr();LAST_TEXT=txt;LAST_PDF_NAME='day-'+day;$('shareTxt').textContent=txt;$('shareBox').hidden=false;var b64=await pdfOut(html,LAST_PDF_NAME);LAST_PDF_BASE64=b64||'';toast('PDF روزانه ذخیره شد — از باکس سبز ارسال کنید')}
function pdfFile(){if(!curPhone){toast('پرونده‌ای باز نیست');return}var ow=MEM.owners.find(function(o){return o.phone===curPhone})||{};var ans=MEM.animals.filter(function(a){return a.phone===curPhone});var h=hdr('پرونده — '+(ow.name||curPhone),'تلفن: '+ow.phone);ans.forEach(function(an){h+='<p><b>'+E(an.name)+' ('+E(an.type)+')</b> — نژاد: '+E(an.breed||'-')+'</p>';var vs=MEM.vacc.filter(function(v){return v.aid===an.id});if(vs.length)h+='<table class="pdf"><tr><th>واکسن</th><th>موعد</th><th>وضعیت</th></tr>'+vs.map(function(v){return '<tr><td>'+E(v.name)+'</td><td>'+FA(pd(v.due))+'</td><td>'+(v.state==='done'?'انجام‌شده':v.state)+'</td></tr>'}).join('')+'</table>';var hs=MEM.hist.filter(function(x){return x.aid===an.id});if(hs.length)h+='<table class="pdf"><tr><th>تاریخ</th><th>نوع</th><th>شرح</th></tr>'+hs.map(function(x){return '<tr><td>'+FA(pd(x.date))+'</td><td>'+E(x.type)+'</td><td>'+E(x.diag+' '+(x.note||''))+'</td></tr>'}).join('')+'</table>'});pdfOut(h,'file-'+curPhone)}
function shareWA(){var t=LAST_TEXT||'';if(!t){toast('اول PDF روزانه بگیرید');return}window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}
function shareTG(){var t=LAST_TEXT||'';if(!t){toast('اول PDF روزانه بگیرید');return}window.open('https://t.me/share/url?url=&text='+encodeURIComponent(t),'_blank')}
async function shareSysText(){var t=LAST_TEXT||'';if(!t){toast('اول PDF روزانه بگیرید');return}try{if(navigator.share){await navigator.share({text:t});}else if(navigator.clipboard){await navigator.clipboard.writeText(t);toast('متن کپی شد')}else{toast(t)}}catch(e){}}
async function shareLastFile(){if(!LAST_PDF_BASE64){toast('اول PDF روزانه بگیرید');return}try{var Cap=window.Capacitor&&window.Capacitor.Plugins;if(Cap&&Cap.Share&&Cap.Filesystem){var p='share/'+LAST_PDF_NAME+'.pdf';try{await Cap.Filesystem.writeFile({path:p,data:LAST_PDF_BASE64,directory:'CACHE',recursive:true})}catch(e){await Cap.Filesystem.writeFile({path:p,data:LAST_PDF_BASE64,directory:'DOCUMENTS',recursive:true})}var u=await Cap.Filesystem.getUri({path:p,directory:'CACHE'}).catch(async function(){return await Cap.Filesystem.getUri({path:p,directory:'DOCUMENTS'})});await Cap.Share.share({title:LAST_PDF_NAME,text:LAST_TEXT,url:u.uri,dialogTitle:'ارسال گزارش روزانه'});return}if(navigator.canShare){var blob=b64ToBlob(LAST_PDF_BASE64,'application/pdf');if(blob){var file=new File([blob],LAST_PDF_NAME+'.pdf',{type:'application/pdf'});try{if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:LAST_PDF_NAME,text:LAST_TEXT});return}}catch(e){}}}toast('فایل در Documents ذخیره شده — از فایل‌ها به تلگرام/واتساپ بفرستید')}catch(e){toast('اشتراک نشد: '+(e.message||e))}}
document.addEventListener('DOMContentLoaded',initDb);document.addEventListener('deviceready',initDb,false);

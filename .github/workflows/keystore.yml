name: Make Keystore (run once)
on:
  workflow_dispatch:
jobs:
  ks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Generate
        run: |
          P=$(openssl rand -hex 12)
          keytool -genkeypair -keystore clinic.jks -alias clinic -keyalg RSA -keysize 2048 -validity 36500 -storepass "$P" -keypass "$P" -dname "CN=Dr Kouchakzadeh, O=Clinic, C=IR"
          { echo "KEYSTORE_PASSWORD:"; echo "$P"; echo; echo "KEYSTORE_BASE64:"; base64 -w0 clinic.jks; echo; } > keystore-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: keystore-info.txt
          retention-days: 1

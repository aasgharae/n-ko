name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Build
        run: |
          cp node_modules/html2canvas/dist/html2canvas.min.js www/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/
          cp "node_modules/vazirmatn/fonts/webfonts/Vazirmatn[wght].woff2" www/vazir.woff2 || cp "$(find node_modules/vazirmatn -name 'Vazirmatn-Regular.woff2' | head -1)" www/vazir.woff2 || true
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.SEND_SMS"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/><application android:requestLegacyExternalStorage="true"#' $M
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: clinic-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

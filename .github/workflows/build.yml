name: Build Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_FILE: ${{ github.workspace }}/clinic.jks
          RUN_NUM: ${{ github.run_number }}
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('assets/icon-only.png').convert('RGBA')
          Image.new('RGBA',(1024,1024),(255,255,255,255)).save('assets/icon-background.png')
          fg=Image.new('RGBA',(1024,1024),(0,0,0,0)); sm=im.resize((700,700)); fg.paste(sm,(162,162),sm); fg.save('assets/icon-foreground.png')
          im.resize((256,256)).save('www/logo.png')
          PY
          cp node_modules/html2canvas/dist/html2canvas.min.js www/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/
          cp "node_modules/vazirmatn/fonts/webfonts/Vazirmatn[wght].woff2" www/vazir.woff2 || cp "$(find node_modules/vazirmatn -name 'Vazirmatn-Regular.woff2' | head -1)" www/vazir.woff2 || true
          npx cap add android
          D=android/app/src/main/java/ir/koochakzadeh/clinic
          mkdir -p $D
          cat > $D/AllFilesPlugin.java <<'JAVA'
          package ir.koochakzadeh.clinic;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AllFiles")
          public class AllFilesPlugin extends Plugin {
            @PluginMethod
            public void check(PluginCall call) {
              JSObject r = new JSObject();
              boolean ok = Build.VERSION.SDK_INT < 30 || Environment.isExternalStorageManager();
              r.put("granted", ok);
              call.resolve(r);
            }

            @PluginMethod
            public void request(PluginCall call) {
              try {
                Intent i = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:" + getContext().getPackageName()));
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(i);
              } catch (Exception e) {
                Intent i = new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(i);
              }
              call.resolve();
            }
          }
          JAVA
          cat > $D/MainActivity.java <<'JAVA'
          package ir.koochakzadeh.clinic;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(AllFilesPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA
          npx -y @capacitor/assets generate --android --iconBackgroundColor '#ffffff' || echo icon-step-failed
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.SEND_SMS"/><uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/><application android:requestLegacyExternalStorage="true"#' $M
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASS" ]; then echo "::error::Secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD are missing. Run the 'Make Keystore' workflow once and add them."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS_FILE"
          python3 - <<'PY'
          import re
          p='android/app/build.gradle'
          g=open(p).read()
          sc="""    signingConfigs {
              release {
                  storeFile file(System.getenv('KS_FILE'))
                  storePassword System.getenv('KS_PASS')
                  keyAlias 'clinic'
                  keyPassword System.getenv('KS_PASS')
              }
          }
          """
          g=re.sub(r'(\n[ \t]*buildTypes\s*\{)', '\n'+sc+r'\1', g, count=1)
          g=re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', g, count=1)
          g=re.sub(r'versionCode\s+\d+', 'versionCode Integer.parseInt(System.getenv("RUN_NUM") ?: "1")', g, count=1)
          assert 'signingConfigs.release' in g and 'RUN_NUM' in g and 'signingConfigs {' in g
          open(p,'w').write(g)
          PY
          cd android && chmod +x gradlew && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Dr-kouchakzadeh-apk
          path: android/app/build/outputs/apk/release/app-release.apk
